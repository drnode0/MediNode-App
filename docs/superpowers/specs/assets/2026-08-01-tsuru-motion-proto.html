<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>知の蔓 — 成長リプレイ 動きモック</title>
<style>
  :root { --ink:#2c2a22; --shu:#b5442c; --paper:#f2ead6; }
  * { margin:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; color:var(--ink);
    background:#e7dfc9; display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:12px 8px 20px;
  }
  .note { font-size:11px; color:#8b8272; margin-bottom:8px; letter-spacing:.05em; }
  .frame {
    width:min(390px, 100vw - 16px); background:var(--paper); border-radius:14px;
    box-shadow:0 6px 30px rgba(60,50,30,.25); overflow:hidden; position:relative;
    background-image:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(180,160,120,.08), transparent),
      radial-gradient(ellipse 50% 30% at 80% 70%, rgba(180,160,120,.07), transparent);
  }
  header {
    padding:14px 16px 6px; display:flex; justify-content:space-between; align-items:flex-start;
  }
  .title { font-size:11px; letter-spacing:.35em; color:#7d6f52; }
  .height { font-size:26px; font-weight:600; letter-spacing:.02em; }
  .sub { font-size:11px; color:#8b8272; margin-top:2px; }
  .phase {
    position:absolute; left:14px; bottom:14px; font-size:10px; color:#a39678;
    letter-spacing:.2em; transition:opacity .3s; z-index:5;
  }
  svg { display:block; width:100%; height:auto; user-select:none; }
  .msg {
    position:absolute; left:0; right:0; bottom:56px; text-align:center; z-index:5;
    font-size:15px; letter-spacing:.14em; color:var(--ink);
    opacity:0; transition:opacity .5s ease; pointer-events:none;
  }
  .msg small { display:block; font-size:10px; color:#8b8272; margin-top:4px; letter-spacing:.1em; }
  .fade {
    position:absolute; inset:0; background:var(--paper); opacity:0; pointer-events:none;
    transition:opacity .22s ease; z-index:8;
  }
  .buttons { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  button {
    font-family:inherit; font-size:12px; letter-spacing:.08em; color:var(--ink);
    background:#faf5e8; border:1px solid #cbbf9f; border-radius:20px; padding:8px 14px;
    cursor:pointer;
  }
  button:active { background:#efe6cf; }
  .hint { font-size:10px; color:#8b8272; margin-top:8px; letter-spacing:.06em; }
  /* 葉の常時ゆらぎ（コンポジタ駆動・位相はJSでばらす） */
  @keyframes sway { from { transform:rotate(-2.2deg);} to { transform:rotate(2.6deg);} }
  .leafSway { transform-box:fill-box; transform-origin:12% 88%; animation:sway 4s ease-in-out infinite alternate; }
  .leafPop  { transform-box:fill-box; transform-origin:8% 60%; }
  @keyframes cupBreath { from { transform:translateY(0);} to { transform:translateY(1.5px);} }
</style>
</head>
<body>
<div class="note">動きの検討用モック — 絵はすべて仮（最終アートはAI生成の筆致アセットに差し替え）</div>

<div class="frame" id="frame">
  <header>
    <div>
      <div class="title">知　の　蔓</div>
      <div class="height" id="hLabel">6.3cm</div>
      <div class="sub" id="subLabel">今週 葉が 12枚</div>
    </div>
    <div style="font-size:10px;color:#a39678;text-align:right;line-height:1.7;letter-spacing:.1em">
      つぎは<br><b style="color:var(--ink)">湯のみ 10cm</b>
    </div>
  </header>

  <svg id="stage" viewBox="0 0 390 620" aria-label="豆の木の成長">
    <defs>
      <mask id="growMask">
        <path id="maskPath" d="" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round"/>
      </mask>
    </defs>

    <g id="world">
      <!-- 湯のみ（次の実物・実寸で同じ地面に立つ） -->
      <g id="cup" style="animation:cupBreath 5s ease-in-out infinite alternate">
        <path id="cupBody" d="" fill="#e9dfc6" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" opacity=".9"/>
        <path id="cupWash" d="" fill="none" stroke="#b9c2ab" stroke-width="7" opacity=".5"/>
        <ellipse id="cupRim" cx="0" cy="0" rx="0" ry="0" fill="none" stroke="var(--ink)" stroke-width="2.5" opacity=".85"/>
        <text id="cupLabel" x="0" y="0" font-size="11" fill="#7d6f52" letter-spacing=".1em" writing-mode="tb">湯のみ 10cm</text>
        <!-- 雀（住人）: 縁にとまっている -->
        <g id="sparrow">
          <path d="M0,0 C6,-9 18,-10 22,-3 C25,2 20,6 12,6 C6,7 1,5 0,0 Z" fill="#6b6353" stroke="var(--ink)" stroke-width="1.5"/>
          <circle cx="19" cy="-5" r="1.3" fill="var(--ink)"/>
          <path d="M22,-3 L27,-1" stroke="var(--ink)" stroke-width="1.5"/>
          <path d="M6,-2 C10,-6 15,-6 17,-3" fill="none" stroke="var(--ink)" stroke-width="1.2" opacity=".7"/>
        </g>
        <!-- 朱の刻み（越えた瞬間に打たれる） -->
        <g id="notch" opacity="0">
          <line x1="0" y1="0" x2="0" y2="0" stroke="var(--shu)" stroke-width="3.5"/>
          <text id="notchDate" x="0" y="0" font-size="9" fill="var(--shu)" letter-spacing=".05em">8/1</text>
        </g>
      </g>

      <!-- 蔓（squash=溜め/着地の伸縮） -->
      <g id="squash">
        <g mask="url(#growMask)">
          <path class="vinePath" d="" fill="none" stroke="#96a67e" stroke-width="21" stroke-linecap="round" opacity=".42"/>
          <path class="vinePath" d="" fill="none" stroke="#55603f" stroke-width="11" stroke-linecap="round" opacity=".88"/>
          <path class="vinePath" d="" fill="none" stroke="#39442c" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="13 21" opacity=".55"/>
          <path class="vinePath" d="" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"
                opacity=".55" transform="translate(5,0)"/>
          <path class="vinePath" d="" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"
                opacity=".4" transform="translate(-5,1)"/>
        </g>
        <!-- 葉はJSが配置（マスク外・個別ポップ） -->
        <g id="leaves"></g>
        <!-- 成長中の穂先 -->
        <g id="tip" opacity="0">
          <circle r="5.5" fill="#4a5537" opacity=".75"/>
          <path d="M0,-4 C5,-10 12,-11 14,-6" fill="none" stroke="#4a5537" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
        </g>
        <g id="splash"></g>
      </g>

      <!-- 地面（筆の横線と墨だまり） -->
      <g id="groundG">
        <path id="groundLine" d="" stroke="var(--ink)" stroke-width="3" opacity=".5" fill="none" stroke-linecap="round"/>
        <path id="groundBlob" d="" fill="var(--ink)" opacity=".75"/>
      </g>

      <!-- 計測（朱筆＝コードが担保する層） -->
      <g id="measure">
        <line id="ghostLine" x1="24" x2="366" y1="0" y2="0" stroke="#8b8272" stroke-width="1" stroke-dasharray="2 5" opacity=".55"/>
        <text id="ghostLabel" x="366" y="0" font-size="9" fill="#8b8272" text-anchor="end" letter-spacing=".1em">前回</text>
        <line id="nowLine" x1="24" x2="366" y1="0" y2="0" stroke="var(--shu)" stroke-width="1.6" stroke-dasharray="6 4" opacity=".9"/>
        <text id="nowLabel" x="24" y="0" font-size="11" fill="var(--shu)" letter-spacing=".08em">いま 6.3cm</text>
        <g id="remain">
          <line id="remainLine" x1="36" x2="36" y1="0" y2="0" stroke="var(--shu)" stroke-width="1.2"/>
          <line x1="32" x2="40" y1="0" y2="0" id="remainCapT" stroke="var(--shu)" stroke-width="1.2"/>
          <line x1="32" x2="40" y1="0" y2="0" id="remainCapB" stroke="var(--shu)" stroke-width="1.2"/>
          <text id="remainLabel" x="44" y="0" font-size="10" fill="var(--shu)" letter-spacing=".05em">あと3.7cm</text>
        </g>
      </g>
    </g>

    <!-- 落款 -->
    <g transform="translate(20,560)">
      <rect width="26" height="26" rx="3" fill="var(--shu)" opacity=".85"/>
      <text x="13" y="19" font-size="15" fill="#f2ead6" text-anchor="middle" font-weight="600">知</text>
    </g>
  </svg>

  <div class="msg" id="msg"></div>
  <div class="fade" id="fade"></div>
  <div class="phase" id="phaseLabel"></div>
</div>

<div class="buttons">
  <button id="btnNormal">ふつうの日（+8mm）</button>
  <button id="btnCross">追い越しの日（湯のみ越え）</button>
  <button id="btnReduced">動きを控えた版</button>
</div>
<div class="hint">再生中に画面タップ＝3倍速 ・ もう一度タップ＝結果へ ・ 終了後は葉をタップしてみてください</div>

<script>
(() => {
  const PX_PER_CM = 40;          // 実寸縮尺（このモックの世界）
  const GROUND_Y = 545;
  const CUP_H_CM = 10, CUP_TOP_Y = GROUND_Y - CUP_H_CM * PX_PER_CM; // 145
  const VINE_D = "M150,545 C 184,490 110,438 142,372 C 168,318 110,262 138,196 C 150,168 134,140 138,108";

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), world = $('world'), squash = $('squash');

  // --- 蔓パスの用意 ---
  const maskPath = $('maskPath');
  maskPath.setAttribute('d', VINE_D);
  document.querySelectorAll('.vinePath').forEach(p => p.setAttribute('d', VINE_D));
  const L = maskPath.getTotalLength();
  maskPath.setAttribute('stroke-dasharray', `${L} ${L}`);

  // y→パス長のルックアップ（yは単調減少）
  const SAMPLES = [];
  for (let i = 0; i <= 600; i++) {
    const len = L * i / 600, pt = maskPath.getPointAtLength(len);
    SAMPLES.push({ len, x: pt.x, y: pt.y });
  }
  function atHeight(cm) { // 高さcm → {len,x,y}
    const targetY = GROUND_Y - cm * PX_PER_CM;
    let lo = 0, hi = SAMPLES.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; (SAMPLES[mid].y > targetY) ? lo = mid + 1 : hi = mid; }
    return SAMPLES[Math.max(0, lo)];
  }
  function setRevealHeight(cm) {
    const s = atHeight(cm);
    maskPath.setAttribute('stroke-dashoffset', String(L - s.len));
    return s;
  }

  // --- 湯のみ・地面・雀 ---
  const cupX = 288, cupW = 186;
  $('cupBody').setAttribute('d',
    `M${cupX - cupW/2},${CUP_TOP_Y} C ${cupX - cupW/2 - 4},${CUP_TOP_Y + 150} ${cupX - cupW/2 + 6},${GROUND_Y - 60} ${cupX - cupW/2 + 12},${GROUND_Y - 14}
     L ${cupX - 26},${GROUND_Y} L ${cupX + 26},${GROUND_Y} L ${cupX + cupW/2 - 12},${GROUND_Y - 14}
     C ${cupX + cupW/2 - 6},${GROUND_Y - 60} ${cupX + cupW/2 + 4},${CUP_TOP_Y + 150} ${cupX + cupW/2},${CUP_TOP_Y} Z`);
  $('cupWash').setAttribute('d',
    `M${cupX - cupW/2 + 10},${CUP_TOP_Y + 60} C ${cupX - 20},${CUP_TOP_Y + 80} ${cupX + 20},${CUP_TOP_Y + 46} ${cupX + cupW/2 - 12},${CUP_TOP_Y + 66}`);
  const rim = $('cupRim');
  rim.setAttribute('cx', cupX); rim.setAttribute('cy', CUP_TOP_Y);
  rim.setAttribute('rx', cupW/2); rim.setAttribute('ry', 14);
  const cupLabel = $('cupLabel');
  cupLabel.setAttribute('x', cupX + cupW/2 - 26); cupLabel.setAttribute('y', CUP_TOP_Y + 40);
  cupLabel.setAttribute('fill', '#b0a27f');
  const sparrow = $('sparrow');
  sparrow.setAttribute('transform', `translate(${cupX + 18}, ${CUP_TOP_Y - 12})`);
  $('groundLine').setAttribute('d', `M20,${GROUND_Y} C 120,${GROUND_Y - 4} 260,${GROUND_Y + 3} 372,${GROUND_Y - 2}`);
  $('groundBlob').setAttribute('d',
    `M124,${GROUND_Y} C 128,${GROUND_Y - 12} 148,${GROUND_Y - 16} 164,${GROUND_Y - 8} C 178,${GROUND_Y - 2} 172,${GROUND_Y + 4} 150,${GROUND_Y + 4} C 134,${GROUND_Y + 4} 122,${GROUND_Y + 3} 124,${GROUND_Y} Z`);
  const notch = $('notch');
  { const n = notch.querySelector('line');
    n.setAttribute('x1', cupX - cupW/2 - 8); n.setAttribute('x2', cupX - cupW/2 + 10);
    n.setAttribute('y1', CUP_TOP_Y); n.setAttribute('y2', CUP_TOP_Y);
    const t = $('notchDate'); t.setAttribute('x', cupX - cupW/2 - 12); t.setAttribute('y', CUP_TOP_Y + 3);
    t.setAttribute('text-anchor', 'end'); }

  // --- 葉 ---
  const LEAF_DEFS = [
    {h:0.9,side:1,s:.9},{h:1.7,side:-1,s:1},{h:2.5,side:1,s:1.1},{h:3.3,side:-1,s:.95},
    {h:4.2,side:1,s:1.05},{h:5.0,side:-1,s:1},{h:5.8,side:1,s:.9},
    {h:6.7,side:-1,s:1.05},{h:7.0,side:1,s:.92},
    {h:7.8,side:-1,s:1},{h:8.6,side:1,s:1.05},{h:9.7,side:-1,s:.95},{h:10.2,side:1,s:1}
  ];
  const leavesG = $('leaves');
  const leaves = LEAF_DEFS.map((d, i) => {
    const p = atHeight(d.h);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${p.x + d.side * 8}, ${p.y}) scale(${d.side * d.s}, ${d.s})`);
    const swayG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    swayG.setAttribute('class', 'leafSway');
    swayG.style.animationDuration = (2.8 + (i * 0.53) % 3.2).toFixed(2) + 's';
    swayG.style.animationDelay = (-(i * 0.91) % 4).toFixed(2) + 's';
    const popG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    popG.setAttribute('class', 'leafPop');
    popG.innerHTML =
      `<path d="M4,0 C10,-4 16,-2 20,2" fill="none" stroke="#39442c" stroke-width="2" stroke-linecap="round" opacity=".8"/>
       <path d="M18,0 C26,-16 48,-16 52,-2 C48,12 26,14 18,0 Z" fill="#7d9169" stroke="#2c2a22" stroke-width="2" stroke-linejoin="round" opacity=".92"/>
       <path d="M20,0 C30,-4 42,-5 50,-2" fill="none" stroke="#39442c" stroke-width="1.4" opacity=".6"/>`;
    swayG.appendChild(popG); g.appendChild(swayG); leavesG.appendChild(g);
    return { ...d, el: g, pop: popG, sway: swayG, shown: false };
  });
  function showLeaf(lf, animate) {
    if (lf.shown) return; lf.shown = true;
    lf.el.style.visibility = 'visible';
    if (animate) lf.pop.animate(
      [{ transform:'scale(0)' }, { transform:'scale(1.16)', offset:.7 }, { transform:'scale(1)' }],
      { duration: 320, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  }
  function hideLeaf(lf) { lf.shown = false; lf.el.style.visibility = 'hidden'; }
  leavesG.addEventListener('click', (e) => {
    const owner = leaves.find(l => l.el.contains(e.target));
    if (owner && !playing) owner.sway.animate(
      [{ transform:'rotate(0deg)' }, { transform:'rotate(9deg)' }, { transform:'rotate(-5deg)' }, { transform:'rotate(0deg)' }],
      { duration: 900, easing: 'ease-out' });
  });

  // --- 計測（朱筆） ---
  const tip = $('tip');
  function setMeasure(cm, ghostCm) {
    const y = GROUND_Y - cm * PX_PER_CM;
    $('nowLine').setAttribute('y1', y); $('nowLine').setAttribute('y2', y);
    $('nowLabel').setAttribute('y', y - 6);
    $('nowLabel').textContent = `いま ${cm.toFixed(1)}cm`;
    $('hLabel').textContent = `${cm.toFixed(1)}cm`;
    const gy = GROUND_Y - ghostCm * PX_PER_CM;
    $('ghostLine').setAttribute('y1', gy); $('ghostLine').setAttribute('y2', gy);
    $('ghostLabel').setAttribute('y', gy - 4);
    const remain = CUP_H_CM - cm, rg = $('remain');
    if (remain > 0.05) {
      rg.setAttribute('opacity', '1');
      $('remainLine').setAttribute('y1', CUP_TOP_Y); $('remainLine').setAttribute('y2', y);
      $('remainCapT').setAttribute('y1', CUP_TOP_Y); $('remainCapT').setAttribute('y2', CUP_TOP_Y);
      $('remainCapB').setAttribute('y1', y); $('remainCapB').setAttribute('y2', y);
      $('remainLabel').setAttribute('y', (CUP_TOP_Y + y) / 2 + 3);
      $('remainLabel').textContent = `あと${remain.toFixed(1)}cm`;
    } else rg.setAttribute('opacity', '0');
  }
  function setVine(cm) {
    const s = setRevealHeight(cm);
    tip.setAttribute('transform', `translate(${s.x}, ${s.y})`);
    leaves.forEach(lf => { if (lf.h <= cm + 1e-6) showLeaf(lf, playing); });
    return s;
  }

  // --- 墨飛沫 ---
  function splashAt(x, y) {
    const g = $('splash');
    for (let i = 0; i < 7; i++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const a = Math.PI * (0.9 + 1.2 * (i / 6)), r = 14 + (i % 3) * 9;
      c.setAttribute('cx', x); c.setAttribute('cy', y);
      c.setAttribute('r', String(1.2 + (i % 3)));
      c.setAttribute('fill', '#2c2a22');
      g.appendChild(c);
      c.animate(
        [{ transform:'translate(0,0)', opacity:.85 },
         { transform:`translate(${Math.cos(a)*r}px, ${-Math.abs(Math.sin(a))*r}px)`, opacity:0 }],
        { duration: 380, easing:'cubic-bezier(.17,.67,.4,1)' }
      ).onfinish = () => c.remove();
    }
  }

  // --- squash（溜め・着地）とカメラ ---
  function setSquash(sy) {
    squash.setAttribute('transform', `translate(0, ${GROUND_Y * (1 - sy)}) scale(1, ${sy})`);
  }
  function setCamera(k, fx, fy) {
    world.setAttribute('transform', k === 1 ? '' : `translate(${fx * (1 - k)}, ${fy * (1 - k)}) scale(${k})`);
  }

  // --- イージング ---
  const easeInCubic = t => t*t*t;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

  // --- シナリオ ---
  const SCEN = {
    normal: { h0: 6.3, h1: 7.1, msg: '葉が 2枚 ふえました', sub: '今週 葉が 14枚' },
    cross:  { h0: 9.3, h1: 10.4, msg: '湯のみを、越えました', sub: '10cmの実物をひとつ、追い越しました', milestone: true }
  };

  // フェーズ列を組む
  function buildPhases(sc) {
    if (!sc.milestone) return [
      { name:'溜め',   dur:.5 },
      { name:'伸び',   dur:1.7, from:sc.h0, to:sc.h1 },
      { name:'着地',   dur:.45 },
      { name:'余韻',   dur:1.5 }
    ];
    return [
      { name:'溜め',   dur:.5 },
      { name:'伸び',   dur:1.25, from:sc.h0, to:CUP_H_CM },
      { name:'間',     dur:.55 },
      { name:'刻み',   dur:.75 },
      { name:'伸び',   dur:.65, from:CUP_H_CM, to:sc.h1 },
      { name:'着地',   dur:.45 },
      { name:'余韻',   dur:1.9 }
    ];
  }

  // --- 再生エンジン（時間ベース＝30fps環境でも自然劣化） ---
  // rAFが止まる環境（非アクティブタブ・省電力）でもsetTimeoutで前進する保険つき
  let playing = false, cancelTick = null, speed = 1, tapCount = 0, current = null;
  const msg = $('msg'), phaseLabel = $('phaseLabel');
  function tick(cb) {
    let done = false;
    const r = requestAnimationFrame((ts) => { if (done) return; done = true; clearTimeout(to); cb(ts); });
    const to = setTimeout(() => { if (done) return; done = true; cancelAnimationFrame(r); cb(performance.now()); }, 50);
    return () => { done = true; cancelAnimationFrame(r); clearTimeout(to); };
  }

  function resetTo(sc) {
    if (cancelTick) cancelTick(); playing = false; speed = 1; tapCount = 0;
    msg.style.opacity = 0; notch.setAttribute('opacity', 0);
    sparrow.setAttribute('transform', `translate(${cupX + 18}, ${CUP_TOP_Y - 12})`);
    setSquash(1); setCamera(1, 0, 0); tip.setAttribute('opacity', 0);
    leaves.forEach(lf => (lf.h <= sc.h0 + 1e-6) ? (hideLeaf(lf), showLeaf(lf, false)) : hideLeaf(lf));
    setVine(sc.h0); setMeasure(sc.h0, sc.h0);
    $('subLabel').textContent = '今週 葉が 12枚';
  }

  function play(key) {
    const sc = SCEN[key]; current = sc;
    resetTo(sc);
    const phases = buildPhases(sc);
    const total = phases.reduce((a, p) => a + p.dur, 0);
    let t = 0, last = performance.now();
    playing = true; tip.setAttribute('opacity', 1);
    let splashed = false, stamped = false, msgShown = false;

    function frame(now) {
      const dt = Math.min((now - last) / 1000, .1); last = now;
      t += dt * speed;
      let acc = 0, ph = phases[phases.length - 1], lp = 1;
      for (const p of phases) {
        if (t < acc + p.dur) { ph = p; lp = (t - acc) / p.dur; break; }
        acc += p.dur;
      }
      phaseLabel.textContent = playing ? `〔${ph.name}〕` : '';

      if (ph.name === '溜め') {
        setSquash(1 - .025 * easeInCubic(lp));
      } else if (ph.name === '伸び') {
        setSquash(1);
        const h = ph.from + (ph.to - ph.from) * easeInOutCubic(lp);
        const s = setVine(h); setMeasure(h, sc.h0);
        if (sc.milestone) { // 越えの前後だけカメラが寄る
          const k = ph.to === CUP_H_CM ? 1 + .18 * easeInCubic(Math.max(0, lp - .55) / .45)
                                       : 1.18 - .18 * easeOutCubic(Math.min(1, lp * 1.6));
          setCamera(k, cupX - cupW/2, CUP_TOP_Y);
        }
      } else if (ph.name === '間') {
        setCamera(1.18, cupX - cupW/2, CUP_TOP_Y);
      } else if (ph.name === '刻み') {
        setCamera(1.18, cupX - cupW/2, CUP_TOP_Y);
        if (!stamped) {
          stamped = true;
          notch.setAttribute('opacity', 1);
          notch.animate([{ opacity:0, transform:'scale(1.6)' }, { opacity:1, transform:'scale(1)' }],
            { duration:260, easing:'ease-out' });
          notch.style.transformBox = 'fill-box'; notch.style.transformOrigin = 'center';
          sparrow.animate(
            [{ transform:`translate(${cupX + 18}px, ${CUP_TOP_Y - 12}px) rotate(0deg)` },
             { transform:`translate(${cupX + 26}px, ${CUP_TOP_Y - 34}px) rotate(-14deg)` },
             { transform:`translate(${cupX + 30}px, ${CUP_TOP_Y - 12}px) rotate(4deg)` },
             { transform:`translate(${cupX + 30}px, ${CUP_TOP_Y - 12}px) rotate(0deg)` }],
            { duration:620, easing:'cubic-bezier(.34,1.3,.64,1)', fill:'forwards' });
          splashAt(cupX - cupW/2, CUP_TOP_Y);
        }
      } else if (ph.name === '着地') {
        setCamera(1, 0, 0);
        setVine(sc.h1); setMeasure(sc.h1, sc.h0);
        setSquash(1 + .02 * Math.sin(Math.PI * Math.min(lp * 1.4, 1)) * (1 - lp * .4));
        if (!splashed) { splashed = true; const s = atHeight(sc.h1); splashAt(s.x, s.y); }
      } else if (ph.name === '余韻') {
        setSquash(1); tip.setAttribute('opacity', 0);
        if (!msgShown) {
          msgShown = true;
          msg.innerHTML = `${sc.msg}<small>${sc.sub}</small>`;
          msg.style.opacity = 1;
          $('subLabel').textContent = sc.sub.startsWith('今週') ? sc.sub : '今週 葉が 14枚';
        }
      }

      if (t >= total) { playing = false; phaseLabel.textContent = ''; return; }
      cancelTick = tick(frame);
    }
    cancelTick = tick(frame);
  }

  function finishNow() {
    if (cancelTick) cancelTick(); playing = false; phaseLabel.textContent = '';
    const sc = current; if (!sc) return;
    setSquash(1); setCamera(1, 0, 0); tip.setAttribute('opacity', 0);
    leaves.forEach(lf => { if (lf.h <= sc.h1 + 1e-6) showLeaf(lf, false); });
    setVine(sc.h1); setMeasure(sc.h1, sc.h0);
    if (sc.milestone) { notch.setAttribute('opacity', 1); }
    msg.innerHTML = `${sc.msg}<small>${sc.sub}</small>`; msg.style.opacity = 1;
  }

  // タップ: 1回目=3倍速 / 2回目=結果へ
  $('frame').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if (!playing) return;
    tapCount++;
    if (tapCount === 1) speed = 3; else finishNow();
  });

  // 動きを控えた版（prefers-reduced-motion相当）
  function playReduced() {
    const sc = SCEN.normal; current = sc;
    const fade = $('fade');
    fade.style.opacity = 1;
    setTimeout(() => {
      resetTo(sc); finishNow();
      fade.style.opacity = 0;
    }, 240);
  }

  $('btnNormal').addEventListener('click', () => play('normal'));
  $('btnCross').addEventListener('click', () => play('cross'));
  $('btnReduced').addEventListener('click', playReduced);

  // 初期状態: ふつうの日の開始前
  resetTo(SCEN.normal);
  setTimeout(() => play('normal'), 700);
})();
</script>
</body>
</html>
