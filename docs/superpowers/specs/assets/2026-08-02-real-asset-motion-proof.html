<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知の蔓 — 実アセット動作証明</title>
<style>
  body { margin:0; background:#e7dfc9; display:flex; justify-content:center; padding:16px;
         font-family:"Hiragino Mincho ProN",serif; }
  .frame { width:min(400px, 96vw); background:#f2ead6; border-radius:14px; overflow:hidden;
           box-shadow:0 6px 30px rgba(60,50,30,.25); position:relative; }
  .stage { position:relative; height:640px; }
  .stage img { position:absolute; user-select:none; -webkit-user-drag:none; }
  .ground { position:absolute; left:6%; right:6%; bottom:58px; border-bottom:3px solid rgba(44,42,34,.5);
            border-radius:50%; }
  /* 蔓の柱: 節を縦積みした列。リビールはwrapperの高さで行う */
  .vineWrap { position:absolute; left:36px; bottom:60px; width:150px; height:0; overflow:hidden; }
  .vineCol { position:absolute; bottom:0; left:0; width:150px; }
  .vineCol img { position:absolute; left:0; width:150px; }
  .tip { position:absolute; left:44px; bottom:60px; width:130px;
         transform-origin:50% 95%; animation:tipSway 3.6s ease-in-out infinite alternate; opacity:0; }
  @keyframes tipSway { from { transform:rotate(-2.4deg);} to { transform:rotate(2.6deg);} }
  .cup { right:28px; bottom:60px; width:190px; }
  .suzume { right:74px; bottom:60px; width:74px; transition:transform .5s cubic-bezier(.34,1.4,.64,1); }
  .usagi { left:150px; bottom:60px; width:96px; transform-origin:50% 100%;
           animation:bob 5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:rotate(-.6deg);} to { transform:rotate(.8deg);} }
  .label { position:absolute; top:14px; left:18px; font-size:11px; letter-spacing:.3em; color:#7d6f52; }
  .h { position:absolute; top:30px; left:18px; font-size:24px; color:#2c2a22; }
  .note { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:10px; color:#a39678; }
  button { position:absolute; top:14px; right:14px; font-family:inherit; font-size:12px;
           background:#faf5e8; border:1px solid #cbbf9f; border-radius:18px; padding:6px 12px; }
</style>
</head>
<body>
<div class="frame">
  <div class="stage" id="stage">
    <div class="label">知　の　蔓（実アセット動作証明）</div>
    <div class="h" id="h">0cm</div>
    <button id="replay">もう一度</button>
    <div class="ground"></div>
    <img class="cup" src="generated/alpha/object_yunomi.png" alt="">
    <img class="usagi" src="generated/alpha/resident_usagi.png" alt="">
    <div class="vineWrap" id="vineWrap">
      <div class="vineCol" id="vineCol">
        <img src="generated/alpha/vine_seg_mid_a.png" style="bottom:0">
        <img src="generated/alpha/vine_seg_mid_a.png" style="bottom:205px; transform:scaleX(-1)">
        <img src="generated/alpha/vine_seg_young_a.png" style="bottom:410px">
      </div>
    </div>
    <img class="tip" id="tip" src="generated/alpha/vine_tip.png" alt="">
    <img class="suzume" id="suzume" src="generated/alpha/resident_suzume.png" alt="">
    <div class="note">切り抜きなし・乗算合成のみ。蔓＝節PNGの縦積みをマスク開示／雀・兎＝丸ごと動く</div>
  </div>
</div>
<script>
(() => {
  const wrap = document.getElementById('vineWrap')
  const tip = document.getElementById('tip')
  const suzume = document.getElementById('suzume')
  const h = document.getElementById('h')
  const MAX = 470            // 蔓の最終höhe(px)
  const CM_PER_PX = 10 / 300 // 湯のみ190px幅像内の器高約300px=10cm相当のなんちゃって換算
  let raf = 0

  function play() {
    clearInterval(raf)
    tip.style.opacity = 0
    suzume.style.transform = 'translateY(0)'
    const T0 = performance.now()
    const DUR = 2600
    const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2
    function step(now) {
      const p = Math.min(1, (now - T0 - 500) / DUR) // 溜め500ms
      const q = p < 0 ? 0 : ease(p)
      const hh = MAX * q
      wrap.style.height = hh + 'px'
      tip.style.bottom = (60 + hh - 26) + 'px'
      tip.style.opacity = p > 0.02 ? 1 : 0
      h.textContent = (hh * CM_PER_PX * 10).toFixed(1).replace(/\.0$/, '') + 'cm'
      if (p >= 0.62 && !suzume.dataset.hopped) { // 蔓が雀の高さを越えた頃にホップ
        suzume.dataset.hopped = '1'
        suzume.style.transform = 'translateY(-330px) translateX(-6px)'
      }
      if (p >= 1) clearInterval(raf)
    }
    delete suzume.dataset.hopped
    raf = setInterval(() => step(performance.now()), 16)
  }
  document.getElementById('replay').addEventListener('click', play)
  Promise.all([...document.images].map(i => i.decode().catch(() => {}))).then(() => setTimeout(play, 400))
})()
</script>
</body>
</html>
