<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知の蔓 — 成長の見た目（筆致マスク彩色）</title>
<style>
  body { margin:0; background:#e7dfc9; display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px;
         font-family:"Hiragino Mincho ProN",serif; }
  .frame { width:min(400px,96vw); background:#f2ead6; border-radius:14px; overflow:hidden;
           box-shadow:0 6px 30px rgba(60,50,30,.25); position:relative; }
  .stage { position:relative; height:690px; }
  .stage img { position:absolute; user-select:none; -webkit-user-drag:none; }
  .ground { position:absolute; left:6%; right:6%; bottom:56px; border-bottom:3px solid rgba(44,42,34,.45); border-radius:50%; }
  .vineWrap { position:absolute; left:36px; bottom:58px; width:190px; height:0; overflow:hidden; }
  .vineCol { position:absolute; bottom:0; left:0; width:190px; }
  .vineCol img { position:absolute; }
  .tip { position:absolute; width:105px; transform-origin:50% 95%;
         animation:tipSway 3.8s ease-in-out infinite alternate; opacity:0; left:72px; }
  @keyframes tipSway { from{transform:rotate(-2.6deg)} to{transform:rotate(2.4deg)} }
  .cup { right:22px; bottom:58px; width:200px; }
  .suzume { right:66px; bottom:58px; width:70px; transition:transform .55s cubic-bezier(.34,1.4,.64,1); }
  .usagi { left:148px; bottom:58px; width:92px; transform-origin:50% 100%; animation:bob 5.4s ease-in-out infinite alternate; }
  @keyframes bob { from{transform:rotate(-.6deg)} to{transform:rotate(.7deg)} }
  /* 葉＝筆致PNG(leaf_single)のアルファをマスクに、状態色をCSSで塗る。
     アンカー（葉柄の先）は画像の 20.3% / 81.3% — ここを茎の中心線に吸着させる */
  .leafPos { position:absolute; }
  .leafPop { opacity:0; transform-origin:20.3% 81.3%; }
  .leafPop.on { opacity:1; animation:pop .34s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from{transform:scale(0)} 70%{transform:scale(1.18)} to{transform:scale(1)} }
  .swayer { transform-origin:20.3% 81.3%; animation:leafSway 4.2s ease-in-out infinite alternate; }
  @keyframes leafSway { from{transform:rotate(-2.4deg)} to{transform:rotate(2.8deg)} }
  .leafArt { -webkit-mask-image:url(generated/alpha/leaf_single.png); mask-image:url(generated/alpha/leaf_single.png);
             -webkit-mask-size:100% 100%; mask-size:100% 100%; }
  .label { position:absolute; top:14px; left:18px; font-size:11px; letter-spacing:.3em; color:#7d6f52; }
  .h { position:absolute; top:30px; left:18px; font-size:24px; color:#2c2a22; }
  .cap { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:10px; color:#a39678; }
  button { position:absolute; top:14px; right:14px; font-family:inherit; font-size:12px;
           background:#faf5e8; border:1px solid #cbbf9f; border-radius:18px; padding:6px 12px; }
  /* 状態見本パネル */
  .legend { width:min(400px,96vw); background:#f2ead6; border-radius:14px; padding:12px 8px 8px;
            box-shadow:0 4px 18px rgba(60,50,30,.18); }
  .legend h2 { margin:0 0 4px 14px; font-size:11px; font-weight:normal; letter-spacing:.25em; color:#7d6f52; }
  .legend .row { display:flex; justify-content:space-around; align-items:flex-end; }
  .legend .cell { text-align:center; }
  .legend .cell .box { position:relative; width:86px; height:86px; margin:0 auto; }
  .legend .cell .box > div { position:absolute; inset:0; }
  .legend .cell p { margin:2px 0 0; font-size:10px; color:#6d6249; }
</style>
</head>
<body>
<div class="frame">
  <div class="stage" id="stage">
    <div class="label">知　の　蔓（筆致マスク彩色）</div>
    <div class="h" id="h">0cm</div>
    <button id="replay">もう一度</button>
    <div class="ground"></div>
    <img class="cup" src="generated/alpha/object_yunomi.png" alt="">
    <img class="usagi" src="generated/alpha/resident_usagi.png" alt="">
    <div class="vineWrap" id="vineWrap">
      <div class="vineCol">
        <img src="generated/alpha/vine_seg_mid_a.png" style="bottom:0; left:0; width:170px">
        <img src="generated/alpha/vine_seg_mid_a.png" style="bottom:225px; left:18px; width:140px; transform:scaleX(-1)">
        <img src="generated/alpha/vine_seg_young_a.png" style="bottom:405px; left:32px; width:115px">
      </div>
    </div>
    <img class="tip" id="tip" src="generated/alpha/vine_tip.png" alt="">
    <img class="suzume" id="suzume" src="generated/alpha/resident_suzume.png" alt="">
    <div id="leaves"></div>
    <div class="cap">葉＝筆の型（leaf_single）のマスク彩色。墨の葉脈・輪郭は濃淡として型に残る</div>
  </div>
</div>
<div class="legend">
  <h2>葉　の　状　態　見　本</h2>
  <div class="row" id="legendRow"></div>
</div>
<script>
(() => {
  const wrap = document.getElementById('vineWrap')
  const tip = document.getElementById('tip')
  const suzume = document.getElementById('suzume')
  const hEl = document.getElementById('h')
  const leavesBox = document.getElementById('leaves')
  const MAX = 560
  const CM_PER_PX = 7 / 120
  // アンカー（葉柄の先）: 実画像の墨画素から測定 (255,1019)/1254
  const AX = 0.203, AY = 0.813
  // 状態色: 青葉=苔色 / 照り=艶の勾配 / fade=銀鼠〜月白（茶色禁止）
  const COLORS = {
    aoba:  '#4c5a3c',
    teri:  'linear-gradient(115deg,#8a9a5e 0%,#4c5a3c 48%,#36452c 100%)',
    fade1: '#8f958a',
    fade2: '#c9cec3',
  }
  const leafFill = (state, s) => {
    const d = document.createElement('div')
    d.className = 'leafArt'
    d.style.width = d.style.height = (76 * s) + 'px'
    d.style.background = COLORS[state] || COLORS.aoba
    return d
  }
  // 輪郭の葉(read): 色を持たない墨の素描。淡い墨を平塗りすると
  // 型のアルファ濃淡（葉脈・輪郭≒0.9／葉身≒0.3）がそのまま線画として立つ
  const leafOutline = s => {
    const d = leafFill('aoba', s)
    d.style.background = 'rgba(44,42,34,.5)'
    return d
  }
  // x = 実画像の墨画素から測定した蔓中心線（stem_x測定値）。葉柄の先をここに吸着する
  const LEAVES = [
    {h:60,x:109.5,side:1,s:.9,r:4},{h:105,x:121.3,side:-1,s:1,r:-3},{h:150,x:112.7,side:1,s:1.05,r:-6},{h:195,x:126.0,side:-1,s:.95,r:5},
    {h:240,x:128.2,side:1,s:1.05,r:0},{h:252,x:118.3,side:-1,s:.85,r:8},{h:264,x:127.8,side:1,s:.75,r:-9},
    {h:300,x:126.9,side:-1,s:1,r:2},{h:345,x:128.2,side:1,s:.95,r:-4},{h:390,x:117.8,side:-1,s:1,r:6},
    {h:420,x:124.9,side:1,s:.8,r:10},{h:432,x:122.6,side:-1,s:.9,r:-7},
    {h:470,x:130.2,side:1,s:.9,r:3},{h:510,x:119.4,side:-1,s:.85,r:-5},{h:548,x:123.3,side:1,s:.8,r:7},
  ]
  // 見た目の確認用: 下の古い葉2枚はうっすら色褪せ・中程1枚は照り葉
  const STATES = { 0:'fade1', 1:'fade1', 7:'teri' }
  const leafEls = LEAVES.map((l, i) => {
    const W = 76 * l.s
    const pos = document.createElement('div')
    pos.className = 'leafPos'
    pos.style.width = pos.style.height = W + 'px'
    // 吸着: アンカー(AX,AY)を茎中心 (l.x, 地面+h) に重ねる。鏡像はアンカーも鏡像
    pos.style.left = (l.side > 0 ? l.x - AX * W : l.x - (1 - AX) * W) + 'px'
    pos.style.bottom = (58 + l.h - (1 - AY) * W) + 'px'
    pos.style.transformOrigin = (l.side > 0 ? AX * 100 : (1 - AX) * 100) + '% ' + (AY * 100) + '%'
    pos.style.transform = (l.side < 0 ? 'scaleX(-1) ' : '') + `rotate(${l.r}deg)`
    const pop = document.createElement('div')
    pop.className = 'leafPop'
    const sw = document.createElement('div')
    sw.className = 'swayer'
    sw.style.animationDelay = (-((i * 1.7) % 4)).toFixed(2) + 's'
    sw.appendChild(leafFill(STATES[i] || 'aoba', l.s))
    pop.appendChild(sw)
    pos.appendChild(pop)
    leavesBox.appendChild(pos)
    return pop
  })
  // 状態見本パネル
  const legendRow = document.getElementById('legendRow')
  ;[
    ['青葉', () => leafFill('aoba', 1.13), '思い出せた'],
    ['照り葉', () => leafFill('teri', 1.13), '磨き直した'],
    ['色褪せ', () => { const d = leafFill('fade1', 1.13); d.style.background = COLORS.fade2; return d }, '90日 経った'],
    ['輪郭の葉', () => leafOutline(1.13), '読んだ'],
  ].forEach(([name, make, note]) => {
    const cell = document.createElement('div')
    cell.className = 'cell'
    const box = document.createElement('div')
    box.className = 'box'
    box.appendChild(make())
    cell.appendChild(box)
    const p = document.createElement('p')
    p.textContent = name
    const q = document.createElement('p')
    q.textContent = note
    q.style.color = '#a39678'
    cell.appendChild(p); cell.appendChild(q)
    legendRow.appendChild(cell)
  })
  let timer = 0
  function play() {
    clearInterval(timer)
    leafEls.forEach(el => el.classList.remove('on'))
    tip.style.opacity = 0
    suzume.style.transform = 'translateY(0)'
    delete suzume.dataset.hopped
    const T0 = performance.now()
    const DUR = 3000
    const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2
    function step() {
      const p = Math.min(1, (performance.now() - T0 - 500) / DUR)
      const q = p < 0 ? 0 : ease(p)
      const hh = MAX * q
      wrap.style.height = hh + 'px'
      tip.style.bottom = (58 + hh - 20) + 'px'
      tip.style.opacity = p > 0.02 ? 1 : 0
      hEl.textContent = (hh * CM_PER_PX).toFixed(1).replace(/\.0$/, '') + 'cm'
      leafEls.forEach((el, i) => { if (LEAVES[i].h <= hh) el.classList.add('on') })
      if (!suzume.dataset.hopped && hh > 300) {
        suzume.dataset.hopped = '1'
        suzume.style.transform = 'translateY(-138px) translateX(-24px)'
      }
      if (p >= 1) clearInterval(timer)
    }
    timer = setInterval(step, 16)
  }
  document.getElementById('replay').addEventListener('click', play)
  Promise.all([...document.images].map(i => i.decode().catch(() => {}))).then(() => setTimeout(play, 300))
})()
</script>
</body>
</html>
