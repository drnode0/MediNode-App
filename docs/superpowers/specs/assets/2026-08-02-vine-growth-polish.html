<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知の蔓 — 葉序と葉の状態（筆致マスク彩色）</title>
<style>
  body { margin:0; background:#e7dfc9; display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px;
         font-family:"Hiragino Mincho ProN",serif; }
  .frame { width:min(400px,96vw); background:#f2ead6; border-radius:14px; overflow:hidden;
           box-shadow:0 6px 30px rgba(60,50,30,.25); position:relative; }
  .stage { position:relative; height:690px; }
  .stage > img { position:absolute; user-select:none; -webkit-user-drag:none; }
  .ground { position:absolute; left:6%; right:6%; bottom:56px; border-bottom:3px solid rgba(44,42,34,.45); border-radius:50%; }
  .vineWrap { position:absolute; left:36px; bottom:58px; width:190px; height:0; overflow:hidden; }
  .vineCol { position:absolute; bottom:0; left:0; width:190px; }
  .vineCol img { position:absolute; }
  .tip { position:absolute; width:105px; transform-origin:50% 95%;
         animation:tipSway 3.8s ease-in-out infinite alternate; opacity:0; left:72px; }
  @keyframes tipSway { from{transform:rotate(-2.6deg)} to{transform:rotate(2.4deg)} }
  .cup { right:22px; bottom:58px; width:200px; }
  .suzume { right:66px; bottom:58px; width:70px; transition:transform .55s cubic-bezier(.34,1.4,.64,1); }
  .usagi { left:148px; bottom:58px; width:92px; transform-origin:50% 100%; animation:bob 5.4s ease-in-out infinite alternate; }
  @keyframes bob { from{transform:rotate(-.6deg)} to{transform:rotate(.7deg)} }

  /* ── 葉 ──
     型 = leaf_single.png のアルファ。葉柄の先（実測 20.3% / 81.3%）を節に吸着させる。
     奥の葉は蔓より後ろ、手前の葉は前。z順は2つのコンテナで分ける */
  .leafPos { position:absolute; }
  .leafPop { opacity:0; transform-origin:20.3% 81.3%; }
  .leafPop.on { opacity:1; animation:pop .34s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from{transform:scale(0)} 70%{transform:scale(1.14)} to{transform:scale(1)} }
  .swayer { transform-origin:20.3% 81.3%; animation:leafSway 4.2s ease-in-out infinite alternate; }
  @keyframes leafSway { from{transform:rotate(-2.2deg)} to{transform:rotate(2.6deg)} }
  .leafArt { -webkit-mask-image:url(generated/alpha/leaf_single.png); mask-image:url(generated/alpha/leaf_single.png);
             -webkit-mask-size:100% 100%; mask-size:100% 100%; }
  /* 線だけ抜く: 同じ型を3枚重ねてアルファを掛け合わせる。
     実測 線α=.867 / 葉身α=.298 → 3乗で 線.651 / 葉身.026（比24.6倍）。
     淡彩が消えて墨の輪郭と葉脈だけが残る＝「輪郭の葉」。
     4乗だと線まで.564まで落ちて見えなくなるので3乗が上限 */
  .leafLine { -webkit-mask-image:url(generated/alpha/leaf_single.png),url(generated/alpha/leaf_single.png),
                                 url(generated/alpha/leaf_single.png);
              mask-image:url(generated/alpha/leaf_single.png),url(generated/alpha/leaf_single.png),
                         url(generated/alpha/leaf_single.png);
              -webkit-mask-size:100% 100%; mask-size:100% 100%;
              -webkit-mask-composite:source-in,source-in;
              mask-composite:intersect,intersect; }
  .layer { position:absolute; inset:0; }
  .leavesBox { position:absolute; inset:0; pointer-events:none; }
  .label { position:absolute; top:14px; left:18px; font-size:11px; letter-spacing:.3em; color:#7d6f52; }
  .h { position:absolute; top:30px; left:18px; font-size:24px; color:#2c2a22; }
  .cap { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:10px; color:#a39678; }
  button { position:absolute; top:14px; right:14px; font-family:inherit; font-size:12px;
           background:#faf5e8; border:1px solid #cbbf9f; border-radius:18px; padding:6px 12px; }
  /* 状態見本 */
  .legend { width:min(400px,96vw); background:#f2ead6; border-radius:14px; padding:12px 8px 10px;
            box-shadow:0 4px 18px rgba(60,50,30,.18); }
  .legend h2 { margin:0 0 6px 14px; font-size:11px; font-weight:normal; letter-spacing:.25em; color:#7d6f52; }
  .legend .row { display:flex; justify-content:space-around; align-items:flex-end; }
  .legend .cell { text-align:center; }
  .legend .cell .box { position:relative; width:84px; height:84px; margin:0 auto; }
  .legend .cell p { margin:3px 0 0; font-size:10.5px; color:#4a4335; }
  .legend .cell p.sub { color:#a39678; font-size:9.5px; }
</style>
</head>
<body>
<div class="frame">
  <div class="stage" id="stage">
    <div class="label">知　の　蔓（葉序 137.5°）</div>
    <div class="h" id="h">0cm</div>
    <button id="replay">もう一度</button>
    <div class="ground"></div>
    <img class="cup" src="generated/alpha/object_yunomi.png" alt="">
    <img class="usagi" src="generated/alpha/resident_usagi.png" alt="">
    <div class="leavesBox" id="leavesBack"></div>
    <div class="vineWrap" id="vineWrap">
      <div class="vineCol">
        <img src="generated/alpha/vine_seg_mid_a.png" style="bottom:0; left:0; width:170px">
        <img src="generated/alpha/vine_seg_mid_a.png" style="bottom:225px; left:18px; width:140px; transform:scaleX(-1)">
        <img src="generated/alpha/vine_seg_young_a.png" style="bottom:405px; left:32px; width:115px">
      </div>
    </div>
    <img class="tip" id="tip" src="generated/alpha/vine_tip.png" alt="">
    <img class="suzume" id="suzume" src="generated/alpha/resident_suzume.png" alt="">
    <div class="leavesBox" id="leavesFront"></div>
    <div class="cap">葉は黄金角137.5°のらせんで着く。奥へ向いた葉は蔓の後ろ・淡く小さく見える</div>
  </div>
</div>
<div class="legend">
  <h2>葉　の　状　態　見　本</h2>
  <div class="row" id="legendRow"></div>
</div>
<script>
(() => {
  const wrap = document.getElementById('vineWrap')
  const tip = document.getElementById('tip')
  const suzume = document.getElementById('suzume')
  const hEl = document.getElementById('h')
  const backBox = document.getElementById('leavesBack')
  const frontBox = document.getElementById('leavesFront')
  const MAX = 560
  const CM_PER_PX = 7 / 120
  const GROUND = 58
  const AX = 0.203, AY = 0.813   // 葉柄の先（型の実測アンカー）
  const GOLDEN = 137.507764      // 開度＝黄金角

  // 蔓の中心線（実画像の墨画素から測定した stem_x）。間は線形で補う
  const STEM = [[60,109.5],[105,121.3],[150,112.7],[195,126.0],[240,128.2],[264,127.8],
                [300,126.9],[345,128.2],[390,117.8],[432,122.6],[470,130.2],[510,119.4],[560,123.3]]
  const stemX = h => {
    if (h <= STEM[0][0]) return STEM[0][1]
    for (let i = 1; i < STEM.length; i++) {
      if (h <= STEM[i][0]) {
        const [h0,x0] = STEM[i-1], [h1,x1] = STEM[i]
        return x0 + (x1 - x0) * (h - h0) / (h1 - h0)
      }
    }
    return STEM[STEM.length-1][1]
  }

  // 葉の大きさ = その葉が出た時の茎の充実度で決まり、出たあとは変わらない
  //  基部＝まだ実生に近く小さい / 中〜上部＝充実期で最大 / 先端＝展開途中でまだ小さい
  const smooth = (a,b,t) => { const x = Math.min(1, Math.max(0, (t-a)/(b-a))); return x*x*(3-2*x) }
  const sizeAt = (h, tipH) => {
    const vigor = 0.70 + 0.46 * smooth(0, 0.52, h / MAX)       // 株の充実（＝出た時の茎の太さ）
    const expanding = 0.52 + 0.48 * smooth(0, 70, tipH - h)    // 穂先近くはまだ展開中
    return vigor * expanding
  }

  const COLORS = {
    aoba:  '#5c6a43',   // 苔色・つや消し
    teri:  '#333f26',   // 磨いた葉は濃く沈む。差は明るさでなく「照りの帯」で出す
    fade:  '#c6cbc2',   // 銀鼠〜月白
  }
  const LEAF_BASE = 92   // 型の一辺(px)。sizeAt を掛けて使う

  // 状態ごとの葉の見た目。box(相対配置)を返す
  function makeLeaf(state, px) {
    const box = document.createElement('div')
    box.style.position = 'relative'
    box.style.width = box.style.height = px + 'px'
    const add = (cls, css) => {
      const d = document.createElement('div')
      d.className = 'layer ' + cls
      Object.assign(d.style, css)
      box.appendChild(d)
      return d
    }
    if (state === 'rinkaku') {
      // 読んだ＝まだ色がない。墨の線だけの素描
      add('leafLine', { background:'#2b281f' })
    } else if (state === 'teri') {
      // 磨き直した＝艶。葉身のα≈.3が頭打ちなので、同じ塗りを2枚重ねて
      // 実効α≈.51まで上げる（＝濃く沈む）。そこへ細い照りの帯を一本走らせる
      add('leafArt', { background:COLORS.teri })
      add('leafArt', { background:COLORS.teri, opacity:'.62' })
      add('leafArt', { background:'linear-gradient(112deg,rgba(255,255,255,0) 6%,rgba(255,255,255,.72) 18%,rgba(255,255,255,.16) 30%,rgba(255,255,255,0) 42%)' })
      add('leafLine', { background:'rgba(22,30,18,.7)' })
    } else if (state === 'fade') {
      // 色褪せ＝彩りが抜けて銀鼠〜月白に。形が読めるよう輪郭は残す
      add('leafArt', { background:COLORS.fade })
      add('leafLine', { background:'rgba(104,110,102,.72)' })
    } else {
      add('leafArt', { background:COLORS.aoba })
    }
    return box
  }

  // ── 葉を生やす ──
  // 節を等間隔に置き、i枚目を 137.5°×i の方向へ。横から見るので
  //   sinθ = 左右の張り出し（＋右／−左）, cosθ = 奥行き（＋手前／−奥）
  const N = 12
  const H0 = 62, H1 = 546
  const TIP_H = MAX
  const leaves = []
  for (let i = 0; i < N; i++) {
    const h = H0 + (H1 - H0) * i / (N - 1)
    const th = (i * GOLDEN) * Math.PI / 180
    const sx = Math.sin(th), depth = Math.cos(th)
    const size = sizeAt(h, TIP_H)
    leaves.push({ h, sx, depth, size, i })
  }

  function build() {
    backBox.innerHTML = ''; frontBox.innerHTML = ''
    return leaves.map(l => {
      const px = LEAF_BASE * l.size
      const front = l.depth >= 0
      const pos = document.createElement('div')
      pos.className = 'leafPos'
      pos.style.width = pos.style.height = px + 'px'
      const cx = stemX(l.h)
      const mirror = l.sx < 0
      // 葉柄の先を節に置く。変換原点は常にその葉柄の先（＝実際の付け根）に取るので、
      // 鏡像でも回転でも付け根は節から動かない。配置は左右で同じ式でよい
      pos.style.left = (cx - AX * px) + 'px'
      pos.style.bottom = (GROUND + l.h - (1 - AY) * px) + 'px'
      pos.style.transformOrigin = (AX * 100) + '% ' + (AY * 100) + '%'
      // 正面を向いた葉ほど横に縮んで見える（見かけの短縮）
      const fore = 0.46 + 0.54 * Math.abs(l.sx)
      // 葉は自重で少し垂れる。大きい葉ほど深く（葉柄まわりのトルク）
      const droop = 5 + 13 * l.size
      pos.style.transform = `scaleX(${(mirror ? -fore : fore).toFixed(3)}) rotate(${droop.toFixed(1)}deg)`
      // 奥の葉は霞んで小さく見える
      const far = front ? 1 : 0.52 + 0.18 * (1 + l.depth)
      pos.style.opacity = far.toFixed(2)
      const pop = document.createElement('div')
      pop.className = 'leafPop'
      const sw = document.createElement('div')
      sw.className = 'swayer'
      sw.style.animationDelay = (-((l.i * 1.7) % 4)).toFixed(2) + 's'
      sw.appendChild(makeLeaf(STATES[l.i] || 'aoba', px))
      pop.appendChild(sw)
      pos.appendChild(pop)
      ;(front ? frontBox : backBox).appendChild(pos)
      return pop
    })
  }
  // 見た目確認用の状態割当（実装では quiz-srs から導出）
  const STATES = { 1:'fade', 3:'rinkaku', 5:'teri', 8:'fade', 10:'rinkaku' }
  const leafEls = build()

  // ── 状態見本 ──
  const legendRow = document.getElementById('legendRow')
  ;[['青葉','aoba','思い出せた'],['照り葉','teri','磨き直した'],
    ['色褪せ','fade','90日 経った'],['輪郭の葉','rinkaku','読んだ']]
  .forEach(([name, state, note]) => {
    const cell = document.createElement('div')
    cell.className = 'cell'
    const box = document.createElement('div')
    box.className = 'box'
    box.appendChild(makeLeaf(state, 84))
    const p = document.createElement('p'); p.textContent = name
    const q = document.createElement('p'); q.className = 'sub'; q.textContent = note
    cell.appendChild(box); cell.appendChild(p); cell.appendChild(q)
    legendRow.appendChild(cell)
  })

  let timer = 0
  function play() {
    clearInterval(timer)
    leafEls.forEach(el => el.classList.remove('on'))
    tip.style.opacity = 0
    suzume.style.transform = 'translateY(0)'
    delete suzume.dataset.hopped
    const T0 = performance.now()
    const DUR = 3000
    const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2
    function step() {
      const p = Math.min(1, (performance.now() - T0 - 500) / DUR)
      const q = p < 0 ? 0 : ease(p)
      const hh = MAX * q
      wrap.style.height = hh + 'px'
      tip.style.bottom = (GROUND + hh - 20) + 'px'
      tip.style.opacity = p > 0.02 ? 1 : 0
      hEl.textContent = (hh * CM_PER_PX).toFixed(1).replace(/\.0$/, '') + 'cm'
      leafEls.forEach((el, i) => { if (leaves[i].h <= hh) el.classList.add('on') })
      if (!suzume.dataset.hopped && hh > 300) {
        suzume.dataset.hopped = '1'
        suzume.style.transform = 'translateY(-138px) translateX(-24px)'
      }
      if (p >= 1) clearInterval(timer)
    }
    timer = setInterval(step, 16)
  }
  document.getElementById('replay').addEventListener('click', play)
  Promise.all([...document.images].map(i => i.decode().catch(() => {}))).then(() => setTimeout(play, 300))
})()
</script>
</body>
</html>
