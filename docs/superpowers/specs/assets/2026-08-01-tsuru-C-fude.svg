<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif">
  <defs>
    <linearGradient id="washi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF6"/>
      <stop offset="1" stop-color="#F4F2E9"/>
    </linearGradient>
    <linearGradient id="sumiGreen" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#2A2A24"/>
      <stop offset="0.55" stop-color="#1D4A38"/>
      <stop offset="1" stop-color="#1E7A54"/>
    </linearGradient>
    <linearGradient id="leafInk" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#26251F"/>
      <stop offset="0.6" stop-color="#1C5F44"/>
      <stop offset="1" stop-color="#238B60"/>
    </linearGradient>
    <linearGradient id="leafWash" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1D6B4B"/>
      <stop offset="1" stop-color="#3AA274"/>
    </linearGradient>
    <!-- 筆のにじみ: エッジを乱す -->
    <filter id="fude" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5.5"/>
    </filter>
    <filter id="fudeFine" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.06" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <filter id="fudeBig" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#washi)"/>

  <!-- ================= ヘッダ（現代の額縁・最小限） ================= -->
  <text x="24" y="58" font-size="9.5" letter-spacing="4.5" font-weight="800" fill="#0F7A5C">知の蔓</text>
  <text x="24" y="90" font-size="21" font-weight="800" fill="#26251F" letter-spacing="0.4">テントウムシを越えた</text>
  <text x="24" y="117" font-size="12.5" fill="#9A968B">いま <tspan font-size="15" font-weight="800" fill="#26251F">6.3</tspan><tspan font-size="10.5" font-weight="700" fill="#26251F">cm</tspan><tspan fill="#DDD9CD">　｜　</tspan>今週 葉が <tspan font-size="15" font-weight="800" fill="#0F7A5C">12</tspan> 枚</text>
  <g>
    <circle cx="356" cy="54" r="14" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="356" cy="54" r="14" fill="none" stroke="#E6E2D6" stroke-width="1"/>
    <path d="M350.8 48.8 L361.2 59.2 M361.2 48.8 L350.8 59.2" stroke="#6B675C" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <line x1="24" y1="146" x2="366" y2="146" stroke="#EAE7DB" stroke-width="0.8"/>
  <text x="195" y="166" text-anchor="middle" font-size="8.5" fill="#C8C3B4" letter-spacing="2.5">富士山 3776m ・ 東京タワー 333m ・ キリン 5m</text>

  <!-- 落款（巻物の右肩） -->
  <g transform="translate(344,182) rotate(3)">
    <rect width="19" height="19" rx="1.5" fill="none" stroke="#BC4230" stroke-width="1.4" opacity="0.85"/>
    <text x="9.5" y="14.8" text-anchor="middle" font-size="12" fill="#BC4230" font-family="Hiragino Mincho ProN, serif">知</text>
  </g>

  <!-- ================= スズメの段（次の次・見物の住人） ================= -->
  <line x1="24" y1="322" x2="366" y2="322" stroke="#DED9CB" stroke-width="1" stroke-dasharray="1.5 6"/>
  <g stroke="#33312A" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(64,274)" filter="url(#fudeFine)">
    <path d="M22 16 C29 6 46 4 54 12 C58 16 59 22 57 27 C62 26 65 28 64 31 C61 33 57 32 54 31 C52 38 44 43 35 44 C25 45 16 41 13 33 C10 26 15 19 22 16 Z" stroke-width="2.6"/>
    <path d="M26 20 C34 17 43 19 47 25 C43 31 33 32 27 28" stroke-width="1.9"/>
    <path d="M15 30 C9 32 4 35 0 39 M16 33 C11 36 7 39 4 43" stroke-width="1.9"/>
    <circle cx="48" cy="17" r="1.9" fill="#33312A" stroke="none"/>
    <circle cx="51" cy="23" r="2.3" fill="#33312A" stroke="none" opacity="0.5"/>
    <path d="M57 27 L65 31 M56 29.5 L63 33" stroke-width="1.7"/>
    <path d="M31 44 L30 49 M30 49 L26.5 50.5 M30 49 L33 50.5 M40 43.5 L40.5 48.5 M40.5 48.5 L37 50 M40.5 48.5 L44 49.5" stroke-width="1.6"/>
  </g>
  <text x="146" y="315" font-size="9.5" fill="#BEB9A9" letter-spacing="1">スズメ ・ 15cm</text>

  <!-- ================= 湯のみ（筆の茶碗・実寸10cm） ================= -->
  <g filter="url(#fudeBig)">
    <!-- 淡い墨のうす塗り -->
    <path d="M208 486 C232 476 352 476 376 486 L364 726 C360 758 330 768 292 768 C254 768 224 758 220 726 Z" fill="#F0EEE3" opacity="0.9"/>
    <!-- 輪郭（勢いのある二筆） -->
    <path d="M206 486 C230 474 354 474 378 486" fill="none" stroke="#33312A" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M208 490 L221 724 C224 756 254 767 292 767" fill="none" stroke="#33312A" stroke-width="3" stroke-linecap="round"/>
    <path d="M376 490 L363 724 C360 754 332 766 296 767" fill="none" stroke="#33312A" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 口縁の内側 -->
    <path d="M222 490 C246 498 338 498 362 490" fill="none" stroke="#8B867A" stroke-width="1.8" opacity="0.8"/>
    <!-- 絵付け: 波の一筆 -->
    <path d="M228 560 C252 550 270 566 292 558 C314 550 334 564 356 554" fill="none" stroke="#5E7E6D" stroke-width="2.6" opacity="0.75"/>
    <!-- 高台 -->
    <path d="M272 768 L268 780 M312 768 L316 780 M266 780 L318 780" fill="none" stroke="#33312A" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="292" y="462" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A473E" letter-spacing="1">湯のみ <tspan fill="#ABA698" font-weight="500" letter-spacing="0">10cm</tspan></text>

  <!-- ================= 蔓（がっつり筆・グイーンと伸びる） ================= -->
  <!-- 茎: 一本の勢い。太→細、先端の頂点はちょうど6.3cmの線 -->
  <g fill="none" stroke="url(#sumiGreen)" stroke-linecap="round" filter="url(#fudeBig)">
    <path d="M206 778 C202 764 200 748 196 730" stroke-width="14"/>
    <path d="M196 730 C190 706 166 700 152 686" stroke-width="10"/>
    <path d="M152 686 C142 672 156 650 172 638" stroke-width="7"/>
    <path d="M172 638 C184 628 186 612 181 600" stroke-width="4.4"/>
    <path d="M181 600 C179 594 182 591 188 590" stroke-width="2.8"/>
  </g>
  <!-- 先端の跳ね（線を越えて筆が抜ける＝勢い） -->
  <g fill="none" stroke="#26251F" stroke-linecap="round" filter="url(#fudeFine)">
    <path d="M188 590 C194 582 198 572 200 560" stroke-width="1.8"/>
    <path d="M200 560 C201 552 202 546 202 540" stroke-width="0.9"/>
  </g>
  <!-- 墨点（成長の飛沫） -->
  <g fill="#26251F">
    <circle cx="204" cy="528" r="1.7"/>
    <circle cx="207" cy="517" r="1.1"/>
    <circle cx="209" cy="507" r="0.7" opacity="0.75"/>
  </g>
  <!-- かすれ（乾いた筆の白） -->
  <g stroke="#FCFBF6" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M203 766 C200 752 198 742 194 730" stroke-width="2.2"/>
    <path d="M190 720 C184 706 172 702 162 694" stroke-width="1.1"/>
  </g>
  <!-- 巻きひげ（節から一巻き） -->
  <path d="M176 634 C187 630 193 622 191 614 C190 608 184 608 183 613 C182 617 186 619 189 617" fill="none" stroke="#33312A" stroke-width="1.5" stroke-linecap="round" filter="url(#fudeFine)"/>

  <!-- 葉: 一筆の筆葉（上向きに開く・左右交互・先端ほど若い） -->
  <g filter="url(#fude)">
    <path d="M0 0 C10 -13 32 -17 46 -8 C36 5 13 7 0 0 Z" transform="translate(202,748) rotate(-24) scale(0.85)" fill="url(#leafWash)" opacity="0.95"/>
    <path d="M0 0 C10 -13 32 -17 46 -8 C36 5 13 7 0 0 Z" transform="translate(188,712) scale(-1,1) rotate(-22)" fill="#C9C5B6" opacity="0.9"/>
    <path d="M0 0 C10 -13 32 -17 46 -8 C36 5 13 7 0 0 Z" transform="translate(166,688) rotate(-26)" fill="url(#leafWash)" opacity="0.92"/>
    <path d="M0 0 C10 -13 32 -17 46 -8 C36 5 13 7 0 0 Z" transform="translate(146,668) scale(-1,1) rotate(-30)" fill="url(#leafWash)" opacity="0.9"/>
    <path d="M0 0 C10 -13 32 -17 46 -8 C36 5 13 7 0 0 Z" transform="translate(164,648) rotate(-28) scale(0.9)" fill="#2E6B4F" opacity="0.92"/>
    <path d="M0 0 C10 -13 32 -17 46 -8 C36 5 13 7 0 0 Z" transform="translate(178,622) scale(-1,1) rotate(-20) scale(0.8)" fill="#C9C5B6" opacity="0.85"/>
  </g>
  <!-- 読んだだけ（墨の輪郭の新芽・先端のそば） -->
  <path d="M0 0 C7 -9 22 -12 32 -6 C25 4 9 5 0 0 Z" transform="translate(177,603) scale(-1,1) rotate(-32)" fill="none" stroke="#33312A" stroke-width="1.5" filter="url(#fudeFine)"/>
  <!-- 葉先の払い -->
  <g stroke="#26251F" stroke-width="1.2" fill="none" stroke-linecap="round" filter="url(#fudeFine)">
    <path d="M106 650 L94 648"/>
    <path d="M206 626 L217 621"/>
  </g>

  <!-- 節（朱の環・葉30枚の結び） -->
  <g fill="none" stroke="#BC4230" filter="url(#fudeFine)">
    <circle cx="152" cy="686" r="6" stroke-width="1.8"/>
    <circle cx="172" cy="638" r="6" stroke-width="1.8"/>
  </g>

  <!-- ================= 朱筆の計測（背比べ） ================= -->
  <line x1="36" y1="591" x2="368" y2="591" stroke="#BC4230" stroke-width="1.1" stroke-dasharray="6 5" opacity="0.9"/>
  <line x1="206" y1="591" x2="220" y2="591" stroke="#BC4230" stroke-width="3"/>
  <text x="36" y="583" font-size="11" font-weight="800" fill="#BC4230" letter-spacing="0.5" paint-order="stroke" stroke="#FCFBF6" stroke-width="3">いま 6.3cm</text>
  <g stroke="#BC4230" stroke-width="0.9" fill="none" opacity="0.95">
    <line x1="352" y1="492" x2="352" y2="587"/>
    <path d="M349.4 497 L352 492 L354.6 497 M349.4 582 L352 587 L354.6 582"/>
  </g>
  <text x="344" y="532" text-anchor="end" font-size="11" font-weight="800" fill="#BC4230" letter-spacing="0.5" paint-order="stroke" stroke="#FCFBF6" stroke-width="3">あと 3.7cm</text>

  <!-- ================= 地面（一筆・かすれて抜ける） ================= -->
  <g filter="url(#fudeFine)">
    <path d="M20 784 C90 780 180 786 250 782 C300 779 340 783 372 781" stroke="#33312A" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M330 782 C346 781 360 781 374 780" stroke="#33312A" stroke-width="1.2" fill="none" opacity="0.5"/>
  </g>

  <!-- ================= 越えてきた住人と道具（すべて筆） ================= -->
  <!-- 単3電池 5cm（筆の輪郭） -->
  <g stroke="#8B867A" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#fudeFine)">
    <path d="M46 640 L78 640 L80 780 L44 780 Z" stroke-width="2"/>
    <path d="M56 640 L56 632 L68 632 L68 640" stroke-width="1.8"/>
    <path d="M46 678 L78 678" stroke-width="1.2"/>
    <path d="M56 660 L68 660 M62 654 L62 666" stroke-width="1.3"/>
  </g>
  <text x="62" y="800" text-anchor="middle" font-size="8.5" fill="#BEB9A9" letter-spacing="1">単3電池 <tspan fill="#BC4230">✓</tspan></text>

  <!-- キャップ 3cm（筆の輪郭・上にテントウムシ） -->
  <g stroke="#8B867A" fill="none" stroke-linecap="round" filter="url(#fudeFine)">
    <path d="M100 740 C100 736 104 734 108 734 L182 734 C186 734 190 736 190 740 L188 776 C188 779 185 780 182 780 L108 780 C105 780 102 779 102 776 Z" stroke-width="2"/>
    <path d="M114 735 L114 779 M132 734 L132 780 M150 734 L150 780 M168 735 L168 779" stroke-width="1" opacity="0.6"/>
  </g>
  <text x="128" y="800" text-anchor="middle" font-size="8.5" fill="#BEB9A9" letter-spacing="1">キャップ <tspan fill="#BC4230">✓</tspan></text>

  <!-- テントウムシ（墨の輪郭に朱の星・キャップのてっぺんで見物） -->
  <g transform="translate(120,704)" stroke="#33312A" fill="none" stroke-linecap="round" filter="url(#fudeFine)">
    <path d="M3 16 A11.5 11.5 0 0 1 26 15 C26 22 21 27 14.5 27.5 C8 27 3 22 3 16 Z" stroke-width="1.9"/>
    <path d="M14.5 5.5 L14 27.5" stroke-width="1.2"/>
    <circle cx="9.5" cy="13" r="1.6" fill="#BC4230" stroke="none"/>
    <circle cx="20" cy="14" r="1.6" fill="#BC4230" stroke="none"/>
    <circle cx="12" cy="21" r="1.4" fill="#BC4230" stroke="none"/>
    <path d="M19 5 C21 3 23 2.5 24.5 3 M10 5.5 C8.5 3.5 6.5 3 5 3.5" stroke-width="1.2"/>
  </g>

  <!-- アリ 3mm（蔓のふもとに一匹） -->
  <g transform="translate(224,766) scale(1.3)" fill="#33312A" filter="url(#fudeFine)">
    <ellipse cx="2" cy="6" rx="2.2" ry="1.8"/>
    <ellipse cx="6" cy="5.4" rx="1.7" ry="1.4"/>
    <ellipse cx="9.6" cy="4.8" rx="2" ry="1.6"/>
    <g stroke="#33312A" stroke-width="0.7" fill="none">
      <path d="M4 7 L2 10 M6 6.8 L5.5 10 M8 6.6 L9 9.8 M10.5 4 L12.5 2.6 M9 3.6 L10 2"/>
    </g>
  </g>
  <text x="204" y="800" text-anchor="middle" font-size="8.5" fill="#BEB9A9" letter-spacing="1">アリ <tspan fill="#BC4230">✓</tspan></text>

  <!-- ================= 凡例 ================= -->
  <line x1="24" y1="810" x2="366" y2="810" stroke="#EAE7DB" stroke-width="0.8"/>
  <g font-size="8.5" fill="#A8A395" letter-spacing="1">
    <path d="M30 828 C34 822 42 820 47 823 C43 830 34 831 30 828 Z" fill="url(#leafWash)"/>
    <text x="53" y="831">ナレッジ</text>
    <path d="M110 828 C114 822 122 820 127 823 C123 830 114 831 110 828 Z" fill="#C9C5B6"/>
    <text x="133" y="831">要再確認</text>
    <path d="M194 828 C198 822 206 820 211 823 C207 830 198 831 194 828 Z" fill="none" stroke="#33312A" stroke-width="1.1"/>
    <text x="217" y="831">読んだだけ</text>
    <circle cx="288" cy="827" r="4" fill="none" stroke="#BC4230" stroke-width="1.3"/>
    <text x="298" y="831">節（葉30枚）</text>
  </g>
</svg>
