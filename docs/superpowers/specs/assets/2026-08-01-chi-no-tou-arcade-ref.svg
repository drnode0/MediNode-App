      <use href="#pleaf" transform="translate(124,1)"/>
    </g>
    <g transform="translate(150,310)"><rect width="120" height="14" fill="#8a8265"/><rect width="120" height="4" fill="#a89f7e"/><rect y="11" width="120" height="3" fill="#6b6448"/></g>
    <g transform="translate(142,324)">
      <rect width="120" height="14" fill="#b394f5"/><rect width="120" height="4" fill="#d7c5ff"/><rect y="11" width="120" height="3" fill="#8a63d6"/>
    </g>
    <g transform="translate(158,338)"><rect width="120" height="14" fill="#16223a" stroke="#56688f" stroke-width="2"/></g>
    <g transform="translate(150,352)">
      <rect width="120" height="14" fill="#4cc3ff"/><rect width="120" height="4" fill="#a5e2ff"/><rect y="11" width="120" height="3" fill="#2795cf"/>
      <use href="#pleaf" transform="translate(124,1)"/>
    </g>
    <g transform="translate(146,366)">
      <rect width="120" height="14" fill="#ffc24b"/><rect width="120" height="4" fill="#ffe097"/><rect y="11" width="120" height="3" fill="#c78e1e"/>
    </g>
  </g>

  <!-- スズメ（ドット・改良版） -->
  <g transform="translate(66,348)">
    <g fill="#9db1d8">
      <rect x="8" y="0" width="8" height="4"/>
      <rect x="4" y="4" width="16" height="4"/>
      <rect x="0" y="8" width="20" height="4"/>
      <rect x="4" y="12" width="12" height="4"/>
    </g>
    <rect x="20" y="4" width="5" height="4" fill="#ffc24b"/>
    <rect x="12" y="4" width="3" height="3" fill="#0e1830"/>
    <g fill="#9db1d8">
      <rect x="6" y="16" width="2" height="3"/><rect x="12" y="16" width="2" height="3"/>
    </g>
    <text x="12" y="32" font-size="9" fill="#5b6f9a" text-anchor="middle">15cm ✓</text>
  </g>

  <!-- ===== VOL.スラブ（地層のジャンル縞つき） ===== -->
  <g>
    <g transform="translate(138,380)">
      <rect width="144" height="26" fill="#223154"/>
      <rect width="144" height="5" fill="#31456f"/>
      <text x="10" y="17" font-size="11" font-weight="700" fill="#9fb4e0" letter-spacing="0.15em">VOL.3</text>
      <use href="#pleaf" transform="translate(122,5)"/>
      <rect x="0" y="21" width="52" height="5" fill="#3ecf8e" opacity="0.75"/>
      <rect x="52" y="21" width="34" height="5" fill="#ffc24b" opacity="0.75"/>
      <rect x="86" y="21" width="30" height="5" fill="#b394f5" opacity="0.75"/>
      <rect x="116" y="21" width="28" height="5" fill="#4cc3ff" opacity="0.75"/>
    </g>
    <g transform="translate(136,406)">
      <rect width="148" height="26" fill="#223154"/>
      <rect width="148" height="5" fill="#31456f"/>
      <text x="10" y="17" font-size="11" font-weight="700" fill="#9fb4e0" letter-spacing="0.15em">VOL.2</text>
      <use href="#pleaf" transform="translate(104,5)"/>
      <use href="#pleaf" transform="translate(124,5)"/>
      <rect x="0" y="21" width="90" height="5" fill="#3ecf8e" opacity="0.75"/>
      <rect x="90" y="21" width="26" height="5" fill="#4cc3ff" opacity="0.75"/>
      <rect x="116" y="21" width="32" height="5" fill="#ffc24b" opacity="0.75"/>
    </g>
    <g transform="translate(140,432)">
      <rect width="140" height="26" fill="#223154"/>
      <rect width="140" height="5" fill="#31456f"/>
      <text x="10" y="17" font-size="11" font-weight="700" fill="#9fb4e0" letter-spacing="0.15em">VOL.1</text>
      <use href="#pleaf" transform="translate(118,5)"/>
      <rect x="0" y="21" width="112" height="5" fill="#3ecf8e" opacity="0.75"/>
      <rect x="112" y="21" width="28" height="5" fill="#b394f5" opacity="0.75"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect x="60" y="458" width="360" height="4" fill="#2c3d61"/>
  <rect x="60" y="462" width="360" height="10" fill="#141f3a"/>

  <!-- 注記 -->
  <text x="296" y="447" font-size="10" fill="#5b6f9a">30歩ごとに VOL. に固まる</text>

  <!-- スキャンラインとブラウン管の暗がり -->
  <rect x="36" y="36" width="408" height="568" rx="16" fill="url(#scan)"/>
  <rect x="36" y="36" width="408" height="568" rx="16" fill="url(#vig)"/>

  <!-- フッターログ -->
  <g>
    <rect x="52" y="496" width="376" height="2" fill="#1c2a49"/>
    <text x="60" y="526" font-size="11" fill="#c9d6ee"><tspan fill="#3ecf8e" font-weight="700">▶ </tspan>きのう <tspan fill="#7bffc4" font-weight="700">敗血症の初期輸液</tspan> に葉が挟まった</text>
    <text x="60" y="550" font-size="11" fill="#8ea3c8"><tspan fill="#ffc24b" font-weight="700">▶ </tspan>くすんだブロックが 3個 → <tspan fill="#3ecf8e">今日の回診へ</tspan></text>
    <text x="60" y="584" font-size="10" fill="#5b6f9a">ブロック＝学びの1歩 ・ 明るさ＝いま即答できるか</text>
  </g>
</svg>
