<svg viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#111c36"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="4" height="1" fill="#000000" opacity="0.18"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0d3a2b" flood-opacity="0.14"/>
    </filter>
    <!-- 若葉スプライト（斜めのドット葉・12x12） -->
    <g id="pleaf">
      <rect x="6" y="0" width="6" height="3" fill="#7bffc4"/>
      <rect x="3" y="3" width="9" height="3" fill="#3ecf8e"/>
      <rect x="0" y="6" width="9" height="3" fill="#3ecf8e"/>
      <rect x="0" y="9" width="4" height="3" fill="#1d9c66"/>
    </g>
    <!-- スコア数字 18.4（cell=6・fillは使用側で指定） -->
    <g id="score">
      <rect x="6" y="0" width="6" height="6"/><rect x="0" y="6" width="6" height="6"/><rect x="6" y="6" width="6" height="6"/>
      <rect x="6" y="12" width="6" height="6"/><rect x="6" y="18" width="6" height="6"/>
      <rect x="0" y="24" width="6" height="6"/><rect x="6" y="24" width="6" height="6"/><rect x="12" y="24" width="6" height="6"/>
      <g transform="translate(26,0)">
        <rect x="0" y="0" width="6" height="6"/><rect x="6" y="0" width="6" height="6"/><rect x="12" y="0" width="6" height="6"/>
        <rect x="0" y="6" width="6" height="6"/><rect x="12" y="6" width="6" height="6"/>
        <rect x="0" y="12" width="6" height="6"/><rect x="6" y="12" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/>
        <rect x="0" y="18" width="6" height="6"/><rect x="12" y="18" width="6" height="6"/>
        <rect x="0" y="24" width="6" height="6"/><rect x="6" y="24" width="6" height="6"/><rect x="12" y="24" width="6" height="6"/>
      </g>
      <rect x="50" y="24" width="6" height="6"/>
      <g transform="translate(62,0)">
        <rect x="0" y="0" width="6" height="6"/><rect x="12" y="0" width="6" height="6"/>
        <rect x="0" y="6" width="6" height="6"/><rect x="12" y="6" width="6" height="6"/>
        <rect x="0" y="12" width="6" height="6"/><rect x="6" y="12" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/>
        <rect x="12" y="18" width="6" height="6"/><rect x="12" y="24" width="6" height="6"/>
      </g>
    </g>
