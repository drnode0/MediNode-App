  <rect width="480" height="640" fill="url(#bg)"/>

  <!-- 筐体（MediNodeのホームカードの中の、ダークな画面） -->
  <rect x="24" y="24" width="432" height="592" rx="24" fill="#0b1322" stroke="#1c2a49" stroke-width="1.5" filter="url(#card)"/>
  <rect x="36" y="36" width="408" height="568" rx="16" fill="url(#screen)"/>

  <!-- 星と月 -->
  <g fill="#31405f">
    <rect x="88" y="150" width="3" height="3"/>
    <rect x="300" y="120" width="2" height="2"/>
    <rect x="150" y="105" width="2" height="2"/>
    <rect x="395" y="180" width="3" height="3"/>
    <rect x="70" y="250" width="2" height="2"/>
    <rect x="410" y="300" width="2" height="2"/>
    <rect x="120" y="330" width="2" height="2"/>
  </g>
  <g fill="#7d94c4">
    <rect x="238" y="112" width="3" height="3"/>
    <rect x="352" y="142" width="2" height="2"/>
    <rect x="96" y="205" width="2" height="2"/>
  </g>
  <g fill="#c9d6ee" opacity="0.85">
    <rect x="372" y="76" width="8" height="4"/>
    <rect x="368" y="80" width="8" height="4"/>
    <rect x="372" y="84" width="8" height="4"/>
  </g>
  <!-- 雲（ドット） -->
  <g fill="#1c2a49">
    <rect x="76" y="176" width="40" height="8"/>
    <rect x="84" y="168" width="24" height="8"/>
    <rect x="360" y="236" width="36" height="8"/>
    <rect x="368" y="228" width="20" height="8"/>
  </g>

  <!-- ヘッダ: タイトルとスコア（ドット数字・緑の落ち影） -->
  <text x="60" y="76" font-size="13" font-weight="700" fill="#3ecf8e" letter-spacing="0.2em">知の塔</text>
  <use href="#score" transform="translate(62,90)" fill="#173a2c"/>
  <use href="#score" transform="translate(60,88)" fill="#eaf2ff"/>
  <text x="148" y="118" font-size="12" fill="#8ea3c8">cm</text>
  <text x="60" y="140" font-size="11" fill="#8ea3c8">学び 214歩 ・ 今週 +9</text>

  <!-- ネコ（ドット絵・30cmの線の上） -->
  <g transform="translate(330,196)">
    <text x="30" y="-8" font-size="10.5" fill="#8ea3c8" text-anchor="middle">ネコ 30cm</text>
    <g fill="#94a8cf">
      <rect x="5" y="0" width="5" height="5"/><rect x="5" y="5" width="10" height="5"/>
      <rect x="45" y="0" width="5" height="5"/><rect x="40" y="5" width="10" height="5"/>
      <rect x="10" y="10" width="40" height="15"/>
      <rect x="15" y="25" width="30" height="5"/>
      <rect x="10" y="30" width="40" height="20"/>
      <rect x="10" y="50" width="15" height="5"/><rect x="35" y="50" width="15" height="5"/>
      <rect x="50" y="45" width="5" height="10"/><rect x="55" y="40" width="5" height="10"/><rect x="55" y="30" width="5" height="10"/>
    </g>
    <g fill="#0e1830">
      <rect x="20" y="15" width="5" height="5"/><rect x="35" y="15" width="5" height="5"/>
    </g>
  </g>
  <!-- 30cmの線（ドット破線） -->
  <g fill="#2c3d61">
    <rect x="60" y="251" width="6" height="2"/><rect x="74" y="251" width="6" height="2"/><rect x="88" y="251" width="6" height="2"/>
    <rect x="102" y="251" width="6" height="2"/><rect x="116" y="251" width="6" height="2"/><rect x="130" y="251" width="6" height="2"/>
    <rect x="144" y="251" width="6" height="2"/><rect x="158" y="251" width="6" height="2"/><rect x="172" y="251" width="6" height="2"/>
    <rect x="186" y="251" width="6" height="2"/><rect x="200" y="251" width="6" height="2"/><rect x="214" y="251" width="6" height="2"/>
    <rect x="228" y="251" width="6" height="2"/><rect x="242" y="251" width="6" height="2"/><rect x="256" y="251" width="6" height="2"/>
    <rect x="270" y="251" width="6" height="2"/><rect x="284" y="251" width="6" height="2"/><rect x="298" y="251" width="6" height="2"/>
    <rect x="312" y="251" width="6" height="2"/><rect x="326" y="251" width="6" height="2"/><rect x="340" y="251" width="6" height="2"/>
    <rect x="354" y="251" width="6" height="2"/><rect x="368" y="251" width="6" height="2"/><rect x="382" y="251" width="6" height="2"/>
    <rect x="396" y="251" width="6" height="2"/><rect x="410" y="251" width="6" height="2"/>
  </g>
  <g transform="translate(330,262)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="#14301f" stroke="#3ecf8e" stroke-width="1"/>
    <text x="30" y="14" font-size="10" font-weight="700" fill="#3ecf8e" text-anchor="middle">あと12歩</text>
  </g>

  <!-- 落下中のブロック（そのナレッジのジャンル色＋名前） -->
  <g>
    <text x="150" y="158" font-size="9.5" fill="#8ea3c8">アナフィラキシー初期対応</text>
    <rect x="150" y="166" width="120" height="14" fill="#ffc24b"/>
    <rect x="150" y="166" width="120" height="4" fill="#ffe097"/>
    <rect x="150" y="177" width="120" height="3" fill="#c78e1e"/>
    <rect x="136" y="150" width="3" height="8" fill="#31405f"/>
    <rect x="282" y="144" width="3" height="12" fill="#31405f"/>
    <g transform="translate(278,158)">
      <rect width="32" height="18" rx="3" fill="#3ecf8e"/>
      <text x="16" y="13" font-size="10.5" font-weight="700" fill="#0b1322" text-anchor="middle">+1</text>
    </g>
  </g>

  <!-- ===== 塔 ===== -->
  <g>
    <g transform="translate(158,268)"><rect width="120" height="14" fill="#16223a" stroke="#56688f" stroke-width="2"/></g>
    <g transform="translate(146,282)">
