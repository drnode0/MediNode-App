<title>Recall 分野ページ 3案</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF1F5;--paper:#F5F7FA;--ink:#1e293b;--mute:#64748b;--faint:#94a3b8;--line:rgba(100,116,139,.3);--gold:#A86B0C;--acc:#0891b2;--hdr:rgba(255,255,255,.95);--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--paper:#0B1524;--ink:#F2F5F1;--mute:#A9B8CC;--faint:#6b7a90;--line:rgba(255,255,255,.14);--gold:#F0D68A;--acc:#22d3ee;--hdr:rgba(17,24,39,.95);--card:#111c2c}}
:root[data-theme="dark"]{--bg:#0f172a;--paper:#0B1524;--ink:#F2F5F1;--mute:#A9B8CC;--faint:#6b7a90;--line:rgba(255,255,255,.14);--gold:#F0D68A;--acc:#22d3ee;--hdr:rgba(17,24,39,.95);--card:#111c2c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
.top{max-width:1180px;margin:0 auto;padding:18px 16px 6px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}
.top h1{font-size:15px;font-weight:500;margin:0;letter-spacing:.04em}
.top p{margin:0;color:var(--mute);font-size:12px}
.top button{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:4px 12px;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:22px;justify-items:center}
.col{width:100%;max-width:390px}
.col>h2{font-size:13px;font-weight:500;margin:0 0 4px;letter-spacing:.06em}
.col>p{margin:0 0 10px;font-size:11.5px;color:var(--mute);line-height:1.6;min-height:3.2em}
.col .meas{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin:6px 0 0}
.phone{position:relative;width:390px;height:760px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;scrollbar-width:thin}
.hdr{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.hdr .brand{text-align:center;font-weight:700;font-size:15px}
.tabs{display:flex;gap:2px;background:rgba(127,140,160,.15);border-radius:12px;padding:4px;margin-top:8px}
.tabs span{flex:1;text-align:center;font-size:10.5px;font-weight:600;padding:5px 0;border-radius:8px;color:var(--mute)}
.tabs span.on{background:rgba(8,145,178,.18);color:var(--acc)}
.pg{padding:14px 16px 60px}
.head{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.emb{width:84px;height:84px;border-radius:50%;border:1px solid var(--mute);position:relative;overflow:hidden}
.emb i{position:absolute;inset:12px;border:1px solid var(--ink);border-radius:50%;opacity:.55}
.emb i:nth-child(2){transform:rotate(60deg) scaleX(.5)}.emb i:nth-child(3){transform:rotate(-50deg) scaleX(.35)}.emb i:nth-child(4){transform:rotate(15deg) scaleY(.4)}.emb i:nth-child(5){transform:rotate(100deg) scaleY(.6);border-color:var(--gold)}
.head h3{margin:0;font-size:24px;font-weight:500;letter-spacing:.04em;line-height:1.15}
.head .en{margin:2px 0 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.head .cnt{margin:5px 0 0;font-size:11.5px;letter-spacing:.05em;color:var(--mute);font-variant-numeric:tabular-nums}
.head .cnt b{color:var(--gold);font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.btns span{font-size:11.5px;letter-spacing:.08em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.btns span.g{border-color:var(--gold);color:var(--gold)}
.toc{position:sticky;top:0;z-index:4;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;margin:0 -2px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.toc a{flex:none;font-size:11px;letter-spacing:.03em;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.toc a.on{border-color:var(--ink);color:var(--ink)}
.toc a em{font-style:normal;color:var(--gold);margin-left:4px}
.art{margin-top:16px;scroll-margin-top:46px}
.art .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--ink) 6%,transparent);border-left:3px solid var(--ink);margin:0 -16px;padding:9px 16px 9px 13px;position:sticky;top:44px;z-index:3}
.art .t h4{margin:0;font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--ink);line-height:1.45;min-width:0}
.art .t h4 small{margin-left:6px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.art .t .rd{flex:none;font-size:11px;color:var(--mute)}
#p1 .art .t{top:0}
.sec{padding-left:2px}
.sec{margin-top:10px}
.sec .sh{font-size:11px;letter-spacing:.06em;color:var(--mute);margin:0 0 5px;line-height:1.4;display:flex;gap:6px;align-items:baseline}
.sec .sh b{font-weight:500;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots i,.row i,.tray i{display:block;flex:none;border-radius:50%;border:1px solid currentColor;box-sizing:border-box;transition:opacity .6s}
.dots i{width:14px;height:14px;cursor:pointer;position:relative}
.dots i::after{content:"";position:absolute;inset:-6px}
.tray i{width:6px;height:6px}
.row i{width:9px;height:9px}
i.kept{background:currentColor}i.settled{background:currentColor;box-shadow:0 0 0 1.5px color-mix(in srgb,currentColor 45%,transparent)}
i.escaping{background:currentColor;color:var(--gold);box-shadow:0 0 6px currentColor}
.dots i.sel{outline:2px solid var(--acc);outline-offset:2px}
.pv{margin:8px 0 2px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-left:2px solid var(--acc);padding:4px 0 4px 10px}
.pv p{margin:0;font-size:12.5px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.pv span{font-size:11px;color:var(--acc);white-space:nowrap}
.pv .st{font-size:10.5px;color:var(--mute);margin-top:1px}
.pv .st.g{color:var(--gold)}
.row{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6;cursor:pointer}
.row i{transform:translateY(1px)}
.row.cold span,.row.touched span{color:var(--faint)}
.row span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ahead{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ahead h4{margin:0;font-size:13.5px;font-weight:500;line-height:1.5}
.ahead h4 small{margin-left:6px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.ahead .tray{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.ahead .chev{color:var(--faint);font-size:12px;padding-top:3px;transition:transform .2s}
.ahead.open .chev{transform:rotate(90deg)}
.ahead .esc{font-size:11px;color:var(--gold);grid-column:1/-1;margin-top:-2px;font-variant-numeric:tabular-nums}
.body{display:none;padding-bottom:6px}
.body.open{display:block}
.body .sh{margin:12px 0 2px;font-size:11px;letter-spacing:.06em;color:var(--faint)}
.veil{position:absolute;inset:0;background:rgba(10,18,30,.35);z-index:20;display:none;align-items:flex-end;padding:0}
.veil.on{display:flex}
.card{background:var(--card);color:var(--ink);width:100%;border-radius:18px 18px 0 0;padding:18px 18px 22px;font-size:14px;line-height:1.7;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.card .src{font-size:11.5px;color:var(--mute);margin-top:8px}
.card .cb{display:flex;gap:8px;margin-top:14px}
.card .cb span{font-size:12px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.card .cb span.g{border-color:var(--gold);color:var(--gold)}
.card .x{float:right;color:var(--faint);font-size:12px;cursor:pointer}
.note{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.6}
.cq{position:sticky;bottom:14px;margin-left:12px;width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;opacity:.85;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:10.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid currentColor;box-sizing:border-box}
</style>
<div class="top"><h1>Recall 分野ページ 3案</h1><p>実データ（呼吸 178件・6記事）。記憶の状態は仮に割り当て。点や行、記事を押すと動きます。</p><button id="th">ダーク／ライト</button></div>
<div class="wrap">
 <div class="col"><h2>案1 点だけ</h2><p>記事ごとに、節で区切った点の列。本文は出さない。点を押すとカードが開く。</p><div class="phone" id="p1"></div><p class="meas" id="m1"></p></div>

 <div class="col"><h2>案3 点＋1行の見出し（採用）</h2><p>案1に、押した点の本文1行を足す。もう一度押すとカード。上に記事の目次（離れかけの数つき）。</p><div class="phone" id="p3"></div><p class="meas" id="m3"></p></div>
</div>
<script>
const DATA=[{"title": "📚 急性呼吸不全 Essentials", "n": 71, "sections": [{"h": "1. 定義と病態", "rows": [{"b": "わが国では、呼吸不全は室内気呼吸時の動脈血酸素分圧（PaO2）60 mmHg以下と定義される。動脈血炭酸ガス分圧（PaCO2）45 mmHg以下をⅠ型呼吸不全、45 mmHgを超えるものをⅡ型呼吸不全に分類する。この定義は在宅酸素療法の健康保険適用基準との整合が取られている。", "s": "西村 2023", "st": "cold", "rem": 0.29}, {"b": "経過から分類すると、呼吸不全が1ヵ月以上持続する場合を慢性呼吸不全、短期間に発症する場合を急性呼吸不全とする。両者では鑑別疾患が異なるため、救急診療では急性呼吸不全の新規発症か、慢性呼吸不全の急性増悪かを見極めることが重要である。", "s": "西村 2023", "st": "cold", "rem": 0.87}, {"b": "英国のガイドラインでは、急性高炭酸ガス性呼吸不全（AHRF）を、呼吸ポンプと肺が正常な動脈血 PaCO2 を維持するのに十分な肺胞換気を確保できない状態と定義している。併存する低酸素血症は通常軽度で、補正可能なことが多い。", "s": "BTS/ICS 2016", "st": "kept", "rem": 0.24}, {"b": "慣習的には、pH 7.35未満かつ PCO2 6.0 kPa（45 mmHg）超を急性呼吸性アシドーシスの診断基準とし、初期薬物治療後も改善しない場合に非侵襲的換気（NIV）を検討する目安としてきた。pH 7.25未満の重度アシドーシスは、侵襲的人工呼吸を検討する目安とされてきた。", "s": "BTS/ICS 2016", "st": "cold", "rem": 0.21}, {"b": "狭義の呼吸不全は動脈血酸素化不全と換気不全の2つであり、前者がⅠ型（hypoxemic respiratory failure）、後者がⅡ型（hypercapnic respiratory failure）になる。4つの要素は明確に一つへ分類できるとは限らず、複数の病態がさまざまな程度で重なり合う。", "s": "西村 2023", "st": "touched", "rem": 0.51}, {"b": "室内気（FiO2 0.21）では、肺胞気動脈血酸素分圧較差は A-aDO2＝150－PaCO2/0.8－PaO2 で求められる。正常値は10 mmHg未満であり、20 mmHg以上は明らかに開大している。", "s": "西村 2023", "st": "cold", "rem": 0.67}, {"b": "動脈血酸素化不全を起こす病態には、換気血流比不均等、拡散障害、肺外右-左シャントがある。換気血流比不均等は呼吸器救急の現場で最も多く遭遇し、肺炎、無気肺、ARDS、肺動静脈瘻、肺血栓塞栓症が含まれる。", "s": "西村 2023", "st": "touched", "rem": 0.07}, {"b": "急性高炭酸ガス性呼吸不全は、COPD 急性増悪の約20%に合併する。COPD の進行、再入院リスクの上昇、長期予後不良を示唆する所見である。", "s": "BTS/ICS 2016", "st": "kept", "rem": 0.99}, {"b": "高炭酸ガス血症を呈した COPD 患者の約12%が当該入院中に死亡し、呼吸性アシドーシスが入院後に発生した場合は33%に上昇した。大規模な症例集積では、急性高炭酸ガス性呼吸不全から回復した後の生存期間中央値は1年であった。", "s": "BTS/ICS 2016", "st": "cold", "rem": 0.57}, {"b": "COPD増悪では、気流制限の悪化とエアトラッピングによる動的過膨張が換気不全をさらに悪化させる。呼吸仕事量の増加や感染の併存によって酸素消費量と二酸化炭素産生量が増え、必要な換気量を確保できなくなることで呼吸困難が生じる。", "s": "西村 2023", "st": "cold", "rem": 0.58}]}, {"h": "2. 臨床像", "rows": [{"b": "頻呼吸は呼吸不全全般でよく認められる所見であり、救急診療では呼吸数を必ず確認することが推奨される。", "s": "西村 2023", "st": "cold", "rem": 0.01}, {"b": "英国のガイドラインでは、COPD増悪に対する NIV の開始基準の一つとして、呼吸数23回/分超を挙げている。", "s": "BTS/ICS 2016", "st": "settled", "rem": 0.73}, {"b": "de novo 急性呼吸不全は、先行する慢性呼吸器疾患がなく、PaO2/FiO2 200以下の低酸素血症、呼吸数30〜35回/分超の頻呼吸、肺炎やARDSなどCOPD以外の原因を伴う病態として定義される。", "s": "ERS/ATS 2017", "st": "settled", "rem": 0.11}, {"b": "HFNC は従来の酸素療法と比べて呼吸数をわずかに低下させる（平均差 2.25回/分低下、95%CI 1.25〜3.24回/分低下、高い確実性）。", "s": "ERS 2022", "st": "touched", "rem": 0.64}, {"b": "低酸素血症の患者では、身体所見としてのチアノーゼよりも頻呼吸と頻脈のほうが多く認められる。英国のガイドラインは、この理由から呼吸数と心拍数を注意深く測定することを求めている。", "s": "BTS 2017", "st": "cold", "rem": 0.81}, {"b": "原因不明の錯乱や興奮は、低酸素血症・高炭酸ガス血症のいずれでも初発症状となりうるため、酸素飽和度の測定に加えて血液ガス分析を考慮する。チアノーゼは、暗い環境や貧血・多血症の患者では客観的に評価しにくい。", "s": "BTS 2017", "st": "settled", "rem": 0.8}, {"b": "高炭酸ガス性呼吸不全の危険因子を有する患者に、急な呼吸困難、酸素飽和度の低下、傾眠、その他の炭酸ガス貯留を示す症状が現れた場合は、血液ガス分析の適応となる（grade D）。", "s": "BTS 2017", "st": "cold", "rem": 0.12}, {"b": "CO2ナルコーシスでは、頭痛、振戦、痙攣、傾眠、著明な発汗、意識障害などを認め、血液ガス分析では呼吸性アシドーシスを伴う高炭酸ガス血症を呈する。意識障害がある場合は、気道確保と気管挿管による人工呼吸の必要性を速やかに評価する。PaCO2 を急速に低下させると、血圧低下や不整脈をきたすおそれがある。", "s": "野口 2024", "st": "escaping", "rem": 0.62}, {"b": "慢性呼吸不全では代償の結果、労作時呼吸困難とチアノーゼ以外は無症状のことも多い。高炭酸ガス血症も腎臓で代償された場合はほとんど無症状である。ただし急性増悪時には急性呼吸不全で見られる症状が出現しうるため、問診と診察を要する。", "s": "西村 2023", "st": "touched", "rem": 0.46}]}, {"h": "3. 診断と検査", "rows": [{"b": "救急外来で呼吸不全が疑われる場合は、4つの病態要素を念頭に病歴聴取と身体診察を行う。動脈血液ガス分析を優先し、胸部X線、心電図、緊急血液検査を組み合わせて鑑別を進める。", "s": "西村 2023", "st": "cold", "rem": 0.14}, {"b": "血液ガス分析は、呼吸不全がⅠ型かⅡ型か、A-aDO2 の開大があるかどうかを確認して病態を推定するために行う。", "s": "西村 2023", "st": "kept", "rem": 0.06}, {"b": "COPD またはその他の高炭酸ガス性呼吸不全の危険因子を有する患者では、初回の PCO2 が正常であっても、30〜60分後に血液ガスを再検する。", "s": "BTS 2017", "st": "escaping", "rem": 0.67}, {"b": "米国の単施設コホートで、パルスオキシメータの酸素飽和度が 92〜96% であった測定のうち、動脈血の酸素飽和度が 88% 未満であったのは黒人患者で749件中88件（11.7%、95%CI 8.5〜16.0）、白人患者で2,778件中99件（3.6%、95%CI 2.7〜4.7）であった。", "s": "Sjoding 2020", "st": "touched", "rem": 0.97}, {"b": "178施設の多施設コホートでも同じ傾向であり、黒人患者939件中160件（17.0%、95%CI 12.2〜23.3）、白人患者8,795件中546件（6.2%、95%CI 5.4〜7.1）であった。両コホートを通じて、パルスオキシメータで検出されない低酸素血症の頻度は黒人患者で白人患者の約3倍であった。", "s": "Sjoding 2020", "st": "touched", "rem": 0.32}, {"b": "動脈血酸素飽和度 88% 未満を検出する ROC 曲線下面積は黒人患者0.84（95%CI 0.81〜0.87）、白人患者0.89（95%CI 0.87〜0.91）であった（P=0.003）。著者らは、パルスオキシメータの値をトリアージと酸素投与量の調整に単独で用いることの限界を指摘している。", "s": "Sjoding 2020", "st": "cold", "rem": 0.17}, {"b": "急性呼吸不全でICUに入室した連続260例で、アーチファクト（水平のAライン・垂直のBライン）、肺スライディング、肺胞のコンソリデーションと胸水の3項目に静脈エコーを組み合わせたプロファイルを評価した。これらのプロファイルを用いると90.5%の症例で正しい診断が得られた。", "s": "Lichtenstein 2008", "st": "touched", "rem": 0.59}, {"b": "気胸の診断では、肺スライディングの消失は特異度が低い（本研究の陽性的中率は22%）。肺点（lung point）まで確認して初めて特異度100%に達する。", "s": "Lichtenstein 2008", "st": "cold", "rem": 0.75}, {"b": "NIV の失敗はより重症の急性呼吸不全で多い。治療前の PaO2/FiO2 200 mmHg未満、および SAPS II 35超は、いずれも挿管の危険が2倍になることと関連する。", "s": "ERS 2022", "st": "cold", "rem": 0.34}, {"b": "NIV 開始1時間後の PaO2/FiO2 175 mmHg未満は、挿管を要することと関連する。低い圧支持で NIV を行っている間の呼気1回換気量が予測体重あたり 9〜9.5 mL を超えることは、良好な感度と特異度で治療失敗を予測する。", "s": "ERS 2022", "st": "kept", "rem": 0.41}, {"b": "COPD増悪に対する NIV では、pH と呼吸数の一方、特に両方が改善することが良好な転帰と関連する。治療に反応する患者では、通常、開始後1〜4時間以内に改善がみられる。", "s": "ERS/ATS 2017", "st": "touched", "rem": 0.03}, {"b": "de novo 呼吸不全における NIV 失敗の早期予測因子は、重症度スコアが高いこと、高齢、原因が ARDS または肺炎であること、治療1時間後に改善しないことである。", "s": "ERS/ATS 2017", "st": "cold", "rem": 0.91}]}, {"h": "4. 鑑別診断", "rows": [{"b": "この検討は診断が確定した260例を対象としており、診断が不確定であった症例と頻度2%未満のまれな原因は除外されている。", "s": "Lichtenstein 2008", "st": "cold", "rem": 0.64}, {"b": "Berlin 定義は、最小 5 cmH2O の呼気終末陽圧を伴う侵襲的または非侵襲的人工呼吸を要件としていた。", "s": "ARDS 新国際定義 2024", "st": "cold", "rem": 0.77}, {"b": "新しい国際定義では、流量30 L/分以上の高流量鼻カニュラ酸素療法を受けている患者も対象に含まれる。低酸素血症は PaO2/FiO2 300 mmHg以下で判定し、SpO2 97%以下の場合は SpO2/FiO2 315以下も使用できる。また、両側陰影の評価手段として肺超音波が追加された。", "s": "ARDS 新国際定義 2024", "st": "cold", "rem": 0.14}, {"b": "換気不全を起こす病態には、脊髄損傷、ALS、重症筋無力症、緊張性気胸、COPD・肺気腫、肺結核後遺症、気管支喘息、薬物が含まれる。", "s": "西村 2023", "st": "cold", "rem": 0.15}, {"b": "呼吸不全の症状を訴える患者の診療では、最初から呼吸器疾患と断定せず、循環器疾患や神経疾患などの可能性も疑い、四要素に立ち返りながら鑑別診断を進める。", "s": "西村 2023", "st": "cold", "rem": 0.1}, {"b": "組織への酸素運搬の不全（重症心不全、重度の貧血）と組織での酸素利用の不全（敗血症、シアン中毒）は、動脈血の酸素化が保たれていても呼吸困難を生じうる。", "s": "西村 2023", "st": "settled", "rem": 0.39}]}, {"h": "5. 初期対応", "rows": [{"b": "その他の危険因子には、病的肥満、嚢胞性線維症、胸郭変形、神経筋疾患、気管支拡張症に伴う固定性の気流閉塞が挙げられている。", "s": "BTS 2017", "st": "settled", "rem": 0.75}, {"b": "高炭酸ガス性呼吸不全の危険がなく酸素飽和度が 85% 未満の患者では、まずリザーバーマスク15 L/分で開始し、安定した後に鼻カニュラ 1〜6 L/分または簡易酸素マスク 5〜10 L/分へ下げて 94〜98% を維持する。", "s": "BTS 2017", "st": "cold", "rem": 0.95}, {"b": "高炭酸ガス性呼吸不全の危険を有する患者で、過去に NIV または侵襲的人工呼吸を要した高炭酸ガス性呼吸不全の既往があり、警告カードを持たない場合は、24% ベンチュリマスク 2〜3 L/分（24% マスクがなければ 28% ベンチュリマスク 4 L/分、または鼻カニュラ 1〜2 L/分）で開始し、目標を 88〜92% とする。", "s": "BTS 2017", "st": "cold", "rem": 0.59}, {"b": "動脈血液ガス分析で pH 7.35未満であれば、NIV または侵襲的人工呼吸の適応を考慮する。pH 7.35以上かつ PaCO2 45 mmHg超であれば、24% または 28% のベンチュリマスク、あるいは微量流量計を用いた鼻カニュラ 1〜2 L/分で酸素を投与し、目標を 88〜92% とする。PaCO2 45 mmHg以下であれば目標を 94〜98% とする。いずれも30〜60分ごとに再評価する。", "s": "西村 2023", "st": "settled", "rem": 0.99}, {"b": "過剰な酸素投与によって高炭酸ガス性呼吸不全が疑われる場合は、酸素療法を 88〜92% を維持できる最低量まで下げる。28% または 24% ベンチュリマスク、あるいは鼻カニュラ 1〜2 L/分で達成しうる。", "s": "BTS 2017", "st": "touched", "rem": 0.56}, {"b": "酸素投与デバイスはⅠ型・Ⅱ型だけで機械的に決めず、必要な FiO2、低酸素血症の重症度、呼吸仕事量、高炭酸ガス性呼吸不全のリスクに応じて選択する。Ⅰ型呼吸不全では鼻カニューレや酸素マスクから開始し、不十分ならリザーバー付き酸素マスクや HFNC へ段階的に強化する。Ⅱ型呼吸不全または高炭酸ガス性呼吸不全のリスクがある場合は、ベンチュリマスクなど FiO2 を一定に保ちやすいデバイスを用い、目標酸素飽和度 88〜92% を維持する。", "s": "西村 2023", "st": "escaping", "rem": 0.53}, {"b": "急性呼吸不全に HFNC を用いる場合は FiO2 60〜100%、流量 40 L/分から開始することが多い。Ⅰ型では 94〜98%、Ⅱ型では 88〜92% を目標とする。", "s": "野口 2024", "st": "cold", "rem": 0.69}, {"b": "成人の急性低酸素性呼吸不全では、従来の酸素療法よりも HFNC の使用が条件付きで推奨されている（エビデンスの確実性：中等度）。短期死亡率に明らかな差はなく（RR 0.99、95%CI 0.84〜1.17）、気管挿管を減らす可能性がある（RR 0.89、95%CI 0.77〜1.02）。HFNC は不快感を軽減し（SMD −0.54）、PaO2 を上昇させる（平均差 16.72 mmHg）が、PaCO2 への影響はほとんどない。", "s": "ERS 2022", "st": "cold", "rem": 0.68}, {"b": "急性低酸素性呼吸不全では、NIV より HFNC を用いることが提案されている（条件付き推奨・非常に低い確実性）。死亡 RR 0.77（95%CI 0.52〜1.14）、挿管 RR 0.84（95%CI 0.61〜1.16）で、いずれも不精確さと間接性により確実性が下げられている。", "s": "ERS 2022", "st": "cold", "rem": 0.84}, {"b": "de novo 急性呼吸不全に対する NIV は、エビデンスが不確実であるため推奨が示されていない。死亡の RR は 0.83（95%CI 0.65〜1.05）、挿管の RR は 0.75（95%CI 0.63〜0.89）で、いずれもエビデンスの確実性は低い。", "s": "ERS/ATS 2017", "st": "cold", "rem": 0.31}, {"b": "de novo 急性呼吸不全に NIV を用いる際の主な懸念は、必要な気管挿管が遅れることである。NIV が無効であった患者では、挿管前の一回換気量が大きく、挿管後の合併症も多い。", "s": "ERS/ATS 2017", "st": "touched", "rem": 0.91}, {"b": "英国のガイドラインでは、1時間の最適な薬物治療後も pH 7.35未満、PaCO2 6.5 kPa以上、呼吸数23回/分超が持続する場合、または新たに認められた場合に NIV の開始を推奨している（grade A）。PaCO2 6.0〜6.5 kPa の患者では、NIV の適応を個別に検討する（grade D）。", "s": "BTS/ICS 2016", "st": "settled", "rem": 0.86}, {"b": "COPD増悪による急性高炭酸ガス性呼吸不全の約20%は、酸素飽和度 88〜92% を目標とする管理を含む最適な薬物治療によって動脈血 pH が正常化する。", "s": "BTS/ICS 2016", "st": "settled", "rem": 0.3}, {"b": "アシドーシスを伴わない代償性の高炭酸ガス血症（pH 7.35以上、PaO2 60 mmHg未満、PaCO2 45 mmHg超）を呈する COPD増悪320例の無作為化比較試験では、入院中の治療失敗は HFNC 群 160例中16例（10.0%）、従来の酸素療法群 160例中31例（19.4%）であった（p=0.026）。24時間後の PaCO2 は HFNC 群で低かった（54.1±9.79 mmHg 対 56.9±10.1 mmHg、p=0.030）。", "s": "Li 2020", "st": "touched", "rem": 0.31}, {"b": "ブラジルの33施設で、5つの臨床サブグループからなる急性呼吸不全患者1,800例を HFNC 群と NIV 群に無作為化した非劣性試験であり、1,766例が試験を完遂した（平均年齢64歳、女性40%）。7日以内の気管挿管または死亡は、HFNC 群で883例中344例（39%）、NIV 群で883例中336例（38%）であった。", "s": "RENOVATE 2025", "st": "touched", "rem": 0.15}, {"b": "臨床サブグループ別では、免疫抑制を伴う低酸素血症群の主要評価項目発生率は、HFNC 群57.1%（16/28）、NIV 群36.4%（8/22）であり、無益性を理由に登録が中止された。心原性肺水腫群ではそれぞれ10.3%（14/136）と21.3%（29/136）、呼吸性アシドーシスを伴うCOPD増悪群では28.6%（10/35）と26.2%（11/42）であった。", "s": "RENOVATE 2025", "st": "kept", "rem": 0.19}, {"b": "HFNC は5群のうち4群で事前に規定した非劣性の基準を満たした。ただし5群間の動的借用を行わない事後解析では、COPD、免疫抑制、心原性肺水腫の3群で質的に異なる結果が得られた。重篤な有害事象の発生率は同等であった（9.4% 対 9.9%）。", "s": "RENOVATE 2025", "st": "cold", "rem": 0.87}, {"b": "29か国で実施された前向き観察研究では、3,659例をスクリーニングし、2,964例を解析した。気管挿管の主な適応は呼吸不全（52.3%）で、神経学的障害（30.5%）、循環不安定（9.4%）が続いた。", "s": "INTUBE 2021", "st": "touched", "rem": 0.8}, {"b": "同研究では、45.2%の患者に少なくとも1つの重大な周挿管期有害事象が発生した。内訳は、収縮期血圧の低下や昇圧薬の新規開始を含む循環不安定、SpO2 80%未満の重度低酸素血症、心停止であり、循環不安定が42.6%と最も多かった。", "s": "INTUBE 2021", "st": "cold", "rem": 0.45}, {"b": "重症患者の緊急気管挿管1,301例の無作為化比較試験では、麻酔導入から挿管2分後までの低酸素血症は NIV による前酸素化群 624例中57例（9.1%）、酸素マスク群 637例中118例（18.5%）であった（絶対リスク差 −9.4ポイント、95%CI −13.2〜−5.6、P<0.001）。心停止は 1例（0.2%）対 7例（1.1%）であった。", "s": "PREOXI 2024", "st": "cold", "rem": 0.39}]}, {"h": "6. ピットフォール", "rows": [{"b": "高炭酸ガス性呼吸不全のリスクを評価せずに高濃度酸素を投与しない。 酸素療法を受けた COPD増悪患者1,027例では、目標酸素飽和度88〜92%の群と比較した院内死亡の調整オッズ比は、93〜96%の群で1.98（95%CI 1.09〜3.60、p=0.025）、97〜100%の群で2.97（95%CI 1.58〜5.58、p=0.001）であった。この関連は、正常炭酸ガス血症のサブグループでも認められた。", "s": "Echevarria 2021", "st": "kept", "rem": 0.14}, {"b": "酸素飽和度が目標範囲内であることを、低酸素血症がない根拠にしない。 パルスオキシメータが 92〜96% を示した測定のうち、動脈血酸素飽和度が 88% 未満であったのは黒人患者の11.7%、白人患者の3.6%であった。", "s": "Sjoding 2020", "st": "cold", "rem": 0.06}, {"b": "初回の血液ガス所見が正常であることを、その後も悪化しない根拠にしない。 COPD増悪では、入院時の血液ガス所見が良好でも、経過中に呼吸性アシドーシスを伴う高炭酸ガス性呼吸不全を発症することがある。初回の PCO2 が正常であっても、30〜60分後に再検する。", "s": "BTS 2017", "st": "kept", "rem": 0.07}, {"b": "アシドーシスのない高炭酸ガス血症に NIV を開始しない。 COPD増悪でアシドーシスを伴わない高炭酸ガス血症では、NIV は死亡を減らさない（RR 1.46、95%CI 0.64〜3.35）。", "s": "ERS/ATS 2017", "st": "cold", "rem": 0.13}, {"b": "急性呼吸性アシドーシスの定義と NIV の開始基準を混同しない。 BTS/ICS 2016 では、急性呼吸性アシドーシスを PCO2 6.0 kPa 超と定義する一方、NIV の開始は PaCO2 6.5 kPa 以上を基準として推奨している。PaCO2 6.0〜6.5 kPa の患者では、NIV を一律に開始するのではなく、個別に検討する（grade D）。", "s": "BTS/ICS 2016", "st": "touched", "rem": 0.93}, {"b": "初期薬物治療への反応を評価せずに NIV の適応を判断しない。 COPD増悪による急性高炭酸ガス性呼吸不全の約20%では、目標酸素飽和度88〜92%の管理を含む最適な薬物治療により pH が正常化する。ガイドラインでは、1時間の初期治療後も呼吸性アシドーシスが持続する場合、または新たに出現した場合に NIV の開始を推奨している。", "s": "BTS/ICS 2016", "st": "cold", "rem": 0.48}, {"b": "de novo 急性低酸素性呼吸不全に、COPD増悪と同じ根拠で NIV を使用しない。 ERS/ATSガイドラインは、de novo 急性呼吸不全に対して NIV を推奨するか否かについて結論を出していない。主な懸念は必要な気管挿管が遅れることであり、開始1時間後に改善がみられないことは NIV 無効の早期予測因子である。", "s": "ERS/ATS 2017", "st": "settled", "rem": 0.82}, {"b": "喘息発作に、COPD増悪からの類推だけで NIV を使用しない。 ERS/ATSガイドラインは、喘息による急性呼吸不全に対して NIV を推奨するか否かについて結論を出していない。気管挿管への影響に関するエビデンスの確実性は非常に低い（RR 4.48、95%CI 0.23〜89.23）。", "s": "ERS/ATS 2017", "st": "settled", "rem": 0.01}, {"b": "免疫抑制のある低酸素性呼吸不全で HFNC を無条件に選ばない。 RENOVATE の免疫抑制のある低酸素血症群は、7日以内の挿管または死亡が HFNC 57.1%（16/28）対 NIV 36.4%（8/22）となり、無益性のため組み入れが中止された。", "s": "RENOVATE 2025", "st": "touched", "rem": 0.25}, {"b": "肺スライディングの消失をもって気胸と診断しない。 本研究で肺スライディング消失の気胸に対する陽性的中率は22%であった。肺点を確認して初めて特異度100%に達する。", "s": "Lichtenstein 2008", "st": "cold", "rem": 0.77}, {"b": "非挿管であることを、ARDS ではない根拠にしない。 新しい国際定義は、流量30 L/分以上の高流量鼻カニュラ酸素療法を受けている患者を対象に含めている。", "s": "ARDS 新国際定義 2024", "st": "cold", "rem": 0.08}, {"b": "PaCO2のみで低酸素血症の病態評価を終わらせない。 換気不全と動脈血酸素化不全は併存しうるため、PaCO2によるⅠ型・Ⅱ型の分類に加え、A-aDO2の開大の有無を確認して低酸素血症の機序を推定する。A-aDO2は10 mmHg未満が正常の目安で、20 mmHg以上は明らかな開大とされる。", "s": "西村 2023", "st": "escaping", "rem": 0.85}, {"b": "呼吸不全の症状を呼吸器疾患と即断しない。 四要素のうち組織への酸素運搬の不全（重症心不全、重度の貧血）と組織での酸素利用の不全（敗血症、シアン中毒）は、循環器疾患・血液疾患・感染症として現れる。", "s": "西村 2023", "st": "touched", "rem": 0.12}, {"b": "挿管を「安全な選択肢」として扱わない。 重症患者の気管挿管では45.2%が重大な周挿管期有害事象を経験し、最多は循環不安定（42.6%）であった。", "s": "INTUBE 2021", "st": "kept", "rem": 0.32}]}]}, {"title": "💡 酸素療法はどのように使い分ける？", "n": 39, "sections": [{"h": "1. 最初に決めるのはデバイスではなく目標SpO₂である", "rows": [{"b": "急性疾患の多くでは、酸素投与はSpO₂ 94〜98%を目標に調整する。", "s": "✅ 🔖 BTS guideline 2017", "st": "kept", "rem": 0.45}, {"b": "日本の酸素療法マニュアルも同様の目標値を採用しており、高CO₂血症（CO₂貯留）のリスクがない患者で94〜98%、リスクがある患者で88〜92%とし、pHは7.35以上を維持する。", "s": "✅ 🔖 野口 2024（日本呼吸ケア・リハ学会誌）", "st": "kept", "rem": 0.53}, {"b": "この目標範囲は非挿管の急性期患者に対するものであり、ICUで人工呼吸中の患者にそのまま当てはまらない。機械換気中の成人16,500例のRCTでは、SpO₂ 90%（88〜92%）を狙う保守的酸素療法と通常の酸素療法で、90日死亡に差がなかった（リスク差 0.7ポイント、95% CI −0.7〜2.0、P=0.28）。", "s": "⚠️ 🔖 UK-ROX（JAMA 2025）", "st": "cold", "rem": 0.08}, {"b": "Chronic obstructive pulmonary disease（COPD）、病的肥満、嚢胞性線維症、胸郭変形、神経筋疾患など高CO₂血症リスクがある患者では、血液ガス確認前の目標SpO₂を通常88〜92%とする（COPDはグレードA、他の疾患はグレードD）。", "s": "✅ 🔖 BTS guideline 2017", "st": "cold", "rem": 0.52}, {"b": "酸素投与中の安定患者でSpO₂が目標範囲を超える場合は、投与経路の変更、または酸素流量を下げてSpO₂を目標範囲内へ戻す。", "s": "✅ 🔖 BTS guideline 2017", "st": "cold", "rem": 0.97}, {"b": "COPD急性増悪2645例のうち、入院時に酸素投与を受けていた1027例の観察研究では、院内死亡率が88〜92%群8.7%、93〜96%群11.7%、97〜100%群17.1%、87%以下群17.1%であった。", "s": "⚠️ 🔖 EMJ 2021", "st": "touched", "rem": 0.44}, {"b": "同研究で88〜92%群を基準とした院内死亡の調整オッズ比は、93〜96%群で1.98（95% CI 1.09〜3.60、p=0.025）、97〜100%群で2.97（95% CI 1.58〜5.58、p=0.001）だった。未調整値（1.40、2.18）より調整後のほうが大きく、E-valueは93〜96%群で3.37、97〜100%群で5.39である。", "s": "⚠️ 🔖 EMJ 2021", "st": "cold", "rem": 0.08}]}, {"h": "2. SpO₂ 85%以上は鼻カニューレ2〜6 L/分で開始し、忍容性で簡易酸素マスクへ替える", "rows": [{"b": "高CO₂血症リスクがない低酸素でSpO₂が85%以上なら、鼻カニューレ2〜6 L/分または簡易酸素マスク5〜10 L/分で開始する。", "s": "✅ 🔖 BTS guideline 2017", "st": "touched", "rem": 0.12}, {"b": "6 L/分は鼻カニューレの上限である。日本の総説は、6 L/分を超える使用は通常の加湿では酸素ガスが鼻粘膜に直接ぶつかって刺激するため勧められないとし、常時口呼吸の患者にも推奨しない。", "s": "✅ 🔖 野口 2024", "st": "touched", "rem": 0.78}, {"b": "鼻カニューレは改善後の段階的減量に適し、安定した回復期では最終的に2 L/分まで下げてから酸素を中止する（高CO₂血症リスクがある患者は1 L/分または24%ベンチュリーマスク2 L/分）。", "s": "✅ 🔖 BTS guideline 2017", "st": "cold", "rem": 0.61}, {"b": "簡易酸素マスクは、鼻カニューレが忍容できないか効果が不十分な場合に用いる。流量は日本では通常5〜8 L/分、BTSは5〜10 L/分としており、国内の運用は5〜8 L/分である。低酸素の重症度で鼻カニューレと使い分けるという記述はどちらにもない。", "s": "✅ 🔖 野口 2024 / 🔖 BTS guideline 2017", "st": "touched", "rem": 0.64}, {"b": "鼻カニューレまたは簡易酸素マスクで目標SpO₂に達しない場合は、リザーバーマスクへ変更し、上級医または専門家へ相談する。", "s": "✅ 🔖 BTS guideline 2017", "st": "escaping", "rem": 0.12}]}, {"h": "3. 強い低酸素ではリザーバーマスクで初期安定化を行う", "rows": [{"b": "高CO₂血症リスクがない患者でSpO₂ 85%未満なら、リザーバーマスク15 L/分で開始し、初期目標SpO₂は94〜98%とする。", "s": "✅ 🔖 BTS guideline 2017", "st": "kept", "rem": 0.36}, {"b": "重症低酸素、ショック、蘇生直後など信頼できるSpO₂測定が得られる前は、リザーバーマスク15 L/分で開始し、測定値が得られたら速やかに酸素投与量を調整する。", "s": "✅ 🔖 BTS guideline 2017", "st": "kept", "rem": 0.08}, {"b": "COPDなど高CO₂血症リスクがある患者でも、重篤な急性疾患では初期救命を優先し、血液ガス結果後に88〜92%を目標とした酸素投与または換気補助へ移行する。", "s": "✅ 🔖 BTS guideline 2017", "st": "kept", "rem": 0.26}]}, {"h": "4. 高CO₂血症リスクではベンチュリーマスクまたは低流量鼻カニューレで調整する", "rows": [{"b": "COPDなど高CO₂血症リスクがあり、かつ呼吸性アシドーシスの既往がない患者では、血液ガス前に24%ベンチュリーマスク2〜3 L/分、28%ベンチュリーマスク4 L/分、または鼻カニューレ1〜2 L/分でSpO₂ 88〜92%を目標にする。", "s": "✅ 🔖 BTS guideline 2017", "st": "cold", "rem": 0.74}, {"b": "高CO₂血症リスク患者では、血液ガスでPCO₂が正常なら目標SpO₂を94〜98%へ変更しうるが、過去にNIVまたは侵襲的人工呼吸を要した高CO₂血症がある場合は88〜92%を維持する。", "s": "✅ 🔖 BTS guideline 2017", "st": "touched", "rem": 0.69}, {"b": "ただしこの「PCO₂が正常なら目標を上げる」運用には反論がある。上記の観察研究は、死亡の傾向が高CO₂血症群と正常CO₂群のどちらでも同様であったことから、二酸化炭素の値で目標飽和度を使い分ける実践は正当化されないとし、COPDは全例88〜92%でよいと主張している。", "s": "⚠️ 🔖 EMJ 2021", "st": "cold", "rem": 0.14}, {"b": "目標SpO₂ 88〜92%の患者では、血液ガスを30〜60分以内に再確認し、高CO₂血症やpH低下を評価する。", "s": "✅ 🔖 BTS guideline 2017", "st": "cold", "rem": 0.41}, {"b": "COPD急性増悪で高CO₂血症のみがありアシドーシスを伴わない場合、ERS/ATSはNIVをルーチンに使わず、標準治療とSpO₂ 88〜92%の酸素調整を重視する。", "s": "✅ 🔖 ERS/ATS NIV guideline 2017", "st": "touched", "rem": 0.61}]}, {"h": "5. 通常酸素で不足する低酸素性呼吸不全ではHFNCを検討する", "rows": [{"b": "ERSのいう通常酸素療法（conventional oxygen therapy）は、鼻カニューレ・リザーバー付マスク・ベンチュリーマスクを含む。ベンチュリーマスクは高流量システムなので、この群を「低流量酸素療法」と呼ぶと、対象の範囲を過小に捉えることになる。", "s": "✅ 🔖 ERS HFNC guideline 2022", "st": "touched", "rem": 0.9}, {"b": "低流量システムと高流量システムを分けるのはその流量が、1回換気量以上のガスを供給できるかである。低流量システムは鼻カニューレ・簡易酸素マスク・開放型酸素マスクで、不足分を室内気で吸うためFiO₂が変動する。高流量システムはベンチュリーマスクとHFNCであり、患者の要する吸気流量に近い流量を投与できるためFiO2の調整がしやすい。", "s": "✅ 🔖 野口 2024", "st": "escaping", "rem": 0.56}, {"b": "HFNCは50〜60 L/分まで送気して呼吸困難のある患者の吸気需要に合わせられるが、通常酸素療法はそれができずFiO₂も安定しない。", "s": "✅ 🔖 ERS HFNC guideline 2022", "st": "cold", "rem": 0.93}, {"b": "急性低酸素性呼吸不全では、ERSは通常酸素療法よりHFNCを条件付きで提案している（確実性はmoderate）。", "s": "✅ 🔖 ERS HFNC guideline 2022", "st": "cold", "rem": 0.97}, {"b": "ERSは急性低酸素性呼吸不全でNIVよりHFNCを条件付きで提案しているが、エビデンスの確実性はvery lowである。", "s": "⚠️ 🔖 ERS HFNC guideline 2022", "st": "kept", "rem": 0.89}, {"b": "HFNCは上気道への低レベルのPEEPによる肺胞リクルートメント、二酸化炭素の洗い流し、確実な加温加湿による快適性の向上を機序として期待する。", "s": "⚠️ 🔖 ERS HFNC guideline 2022", "st": "escaping", "rem": 0.62}, {"b": "通常酸素療法と比べたHFNCの死亡率への影響は小さく、ERSは1%未満と判断している。主な利点は挿管の回避である。", "s": "⚠️ 🔖 ERS HFNC guideline 2022", "st": "cold", "rem": 0.62}, {"b": "HFNCまたはNIVで改善しない患者に非侵襲的呼吸サポートを遷延させると、挿管が遅れて院内死亡が悪化しうる。ただしERS 2022には、HFNCの失敗を判定する具体的な基準もROX indexも記載されていない。", "s": "⚠️ 🔖 ERS HFNC guideline 2022", "st": "settled", "rem": 0.28}]}, {"h": "6. 換気不全ではHFNCよりNIV、破綻すれば挿管を選ぶ", "rows": [{"b": "COPD急性増悪によるpH ≤7.35の呼吸性アシドーシス（急性、または慢性に急性が重なったもの）では、ERS/ATSは二相性NIVを強く推奨している（確実性はhigh）。", "s": "✅ 🔖 ERS/ATS NIV guideline 2017", "st": "cold", "rem": 0.29}, {"b": "COPD急性増悪でpH 7.25〜7.35の軽度から中等度アシドーシスでは、NIVの成功を予測する所見として1〜4時間以内のpHまたは呼吸数改善が挙げられる。", "s": "✅ 🔖 ERS/ATS NIV guideline 2017", "st": "settled", "rem": 0.04}, {"b": "ERS HFNCガイドラインは、COPDの急性高CO₂性呼吸不全ではHFNCより先にNIVを試すことを条件付きで提案している。", "s": "✅ 🔖 ERS HFNC guideline 2022", "st": "escaping", "rem": 0.21}, {"b": "急性心原性肺水腫では、ERS/ATSはCPAPまたは二相性NIVを強く推奨している。", "s": "✅ 🔖 ERS/ATS NIV guideline 2017", "st": "kept", "rem": 0.64}, {"b": "最適化したNIV下でpH 7.25未満、呼吸数25超の持続、新規の錯乱または患者の苦痛のいずれかを認めたら、同調性・マスクの密着・呼気ポートを確認し、改善しなければ侵襲的人工呼吸を検討する。", "s": "✅ 🔖 BTS/ICS AHRF guideline 2016", "st": "cold", "rem": 0.52}, {"b": "NIVで胸郭の動きやPaCO₂が改善しない場合、またはNIV下でSaO₂ 85〜88%を維持できない場合は、ICUへ紹介する。", "s": "✅ 🔖 BTS/ICS AHRF guideline 2016", "st": "settled", "rem": 0.61}, {"b": "COPD急性増悪で侵襲的人工呼吸の適応となるのは、切迫した呼吸停止、重度の呼吸窮迫、NIVの不成功または禁忌、NIV下でpH 7.15未満が持続するかpHが悪化すること、Glasgow Coma Scale 8未満の意識障害である。", "s": "✅ 🔖 BTS/ICS AHRF guideline 2016", "st": "cold", "rem": 0.69}, {"b": "BTS/ICSはNIVの絶対禁忌を重度の顔面変形、顔面熱傷、固定した上気道閉塞に限り、pH 7.15未満、Glasgow Coma Scale 8未満、錯乱・興奮、認知機能障害は相対禁忌として観察を強化する扱いにしている。", "s": "✅ 🔖 BTS/ICS AHRF guideline 2016", "st": "cold", "rem": 0.77}, {"b": "ただし意識障害は一律の禁忌ではない。Glasgow Coma Scale 8未満の患者でも、意識が保たれた患者と同等の転帰だった症例集積がある。", "s": "⚠️ 🔖 BTS/ICS AHRF guideline 2016", "st": "kept", "rem": 0.64}, {"b": "ERS/ATSも同じ症例集積を引き、高CO₂性昏睡の有無で転帰に差がなかったと述べている（ただし意識レベルの値は示していない）。", "s": "⚠️ 🔖 ERS/ATS NIV guideline 2017", "st": "cold", "rem": 0.23}, {"b": "気道保護困難と嘔吐リスクは、いずれのガイドラインでも挿管移行の基準として挙げられていない。嘔吐については、NIVマスクを速やかに外せるか、患者が嘔気を伝えられるかが判断点とされる。", "s": "⚠️ 🔖 BTS/ICS AHRF guideline 2016", "st": "cold", "rem": 0.02}]}]}, {"title": "💡 人工呼吸器患者の気管吸引はいつ・どう行うべきか？", "n": 24, "sections": [{"h": "1. ルーチン吸引は行わない——分泌物の徴候があるときにのみ行う", "rows": [{"b": "「吸引は分泌物が存在するときのみ行い、ルーチンには行わない」は AARC CPG 2010 の推奨16.1（GRADE 1C）。", "s": "✅（AARC CPG 2010（Respir Care 2010;55:758-764））", "st": "cold", "rem": 0.6}, {"b": "AARC 2022もこの2010年の推奨を引き継いで支持しているが、根拠として採用できた研究は新生児RCT 1件・小児RCT 1件のみで、成人の吸引頻度を扱った研究は見つからなかったと明記している（evidence level B）。成人への適用は生理学的妥当性と小児データからの外推による。", "s": "⚠️（AARC 2022（Respir Care 2022;67(2)））", "st": "kept", "rem": 0.53}, {"b": "吸引適応の最も有用な判断材料は①気道内の目視できる分泌物、②聴診での呼吸音の異常（粗い断続性副雑音など）、③グラフィックモニターの鋸歯状波形の3つ。", "s": "✅（AARC 2022）", "st": "cold", "rem": 0.75}, {"b": "補助的な徴候として気道内圧上昇・一回換気量低下・SpO2低下・咳嗽も参考になるが、これら単独では吸引を正当化しない。", "s": "⚠️（AARC CPG 2010）", "st": "cold", "rem": 0.58}, {"b": "小児ICUのRCTでは、必要時吸引群の複合有害イベント（低酸素・不整脈・事故抜管・心停止）は47% vs ルーチン吸引群55%で、吸引回数を減らしても安全性は劣らなかった。", "s": "✅（As-needed vs routine suctioning RCT, PICU 2018）", "st": "kept", "rem": 0.38}, {"b": "吸引そのものが有害イベントを誘発しうる：心停止後患者の前向き観察では吸引処置の10.3%で酸素飽和度低下が生じた。", "s": "⚠️（Short-term effects of endotracheal suctioning in post-cardiac arrest patients 2022）", "st": "cold", "rem": 0.11}]}, {"h": "2. 吸引前の準備：前酸素化し、回路は外さない", "rows": [{"b": "吸引でSpO2が低下しやすい患者では、吸引前に100%酸素を30〜60秒以上（低酸素リスク例では1分程度）投与する前酸素化を行う（全例に100%が必須とは限らず、ベースライン+FiO2上乗せで足りる場合もある）。", "s": "✅（AARC CPG 2010（30〜60秒・人工呼吸器で調整）／2水準の前酸素化を比較, Respir Care 2017／AARC 2022）", "st": "touched", "rem": 0.98}, {"b": "前酸素化はバッグ換気ではなく人工呼吸器の酸素濃度一時上昇機能（O2 boost/前酸素化モード）で行う方がPaO2低下を防ぎPEEPも維持できる。", "s": "⚠️（AARC CPG 2010）", "st": "cold", "rem": 0.89}, {"b": "回路を外さずに吸引すること（閉鎖式、または回路接続のまま）が推奨される——肺の虚脱（de-recruitment）を防ぐため。", "s": "✅（AARC 2022）", "st": "escaping", "rem": 0.81}, {"b": "成人ではCochrane 2007（16試験）で閉鎖式と開放式はVAP・死亡・ICU滞在に差がないとされる（ただしVAP予防効果は一次資料間で結論が割れる。§5参照）。高FiO2・高PEEP患者で閉鎖式が選択されるのは、換気・肺容量の維持という生理学的理由による。", "s": "⚠️（Cochrane 2007）", "st": "touched", "rem": 0.41}]}, {"h": "3. 手技の実際：浅い吸引・15秒以内・吸引圧は150 mmHg以下", "rows": [{"b": "カテーテル挿入深さは「浅い吸引（shallow suction）」——気管チューブ先端まで——が推奨され、深い吸引（カリーナまで）は浅い吸引が無効な場合のみ。", "s": "✅（AARC 2022）", "st": "cold", "rem": 0.62}, {"b": "浅い吸引と深い吸引で心拍数・血圧への影響は同等とするRCTがある（この研究では浅い吸引の方がカテーテル挿入回数＝気管への操作が増えた）。深い吸引の粘膜損傷・出血・気道攣縮リスクを踏まえ、原則は「必要最小限の深さ」。", "s": "⚠️（Shallow vs deep endotracheal suctioning, Iran J Nurs Midwifery Res 2014／リスク面はAARC 2022）", "st": "cold", "rem": 0.44}, {"b": "1回の吸引操作は挿入開始から終了まで15秒以内、吸引圧は閉塞時20 kPa（約150 mmHg）を超えない。", "s": "✅（気管吸引ガイドライン2023〔改訂第3版〕（日本呼吸療法医学会））", "st": "cold", "rem": 0.32}, {"b": "日本の気管吸引ガイドライン2023は吸引圧の上限を20 kPa（150 mmHg）と定めており、実務上は80〜120 mmHgが常用される。一方、AARC 2022は成人で吸引圧を−200 mmHg未満に保つことを推奨しており、国際文献では推奨吸引圧の幅は広い（報告により80〜300 mmHg）。圧を上げると吸引される分泌物量は増えるが酸素飽和度低下・高血圧の発生率に有意差はなかったとする報告もある。安全域を優先し、本ページでは日本ガイドライン準拠の150 mmHg以下を推奨する。", "s": "⚠️（Increasing suction pressure increases secretions but not complications 2020）", "st": "cold", "rem": 0.22}, {"b": "吸引カテーテル外径は気管チューブ内径の1/2以下（成人）を選択する（例：ID 8.0 mmなら12 Fr以下）。", "s": "✅（AARC CPG 2010）", "st": "cold", "rem": 0.96}]}, {"h": "4. 生理食塩水の注入（インスティレーション）はルーチンでは行わない", "rows": [{"b": "AARC 2022・気管吸引ガイドライン2023とも、吸引前の生理食塩水注入をルーチンに行わないことを推奨。", "s": "✅（AARC 2022／JRCM 2023）", "st": "cold", "rem": 0.4}, {"b": "複数のメタ解析で、吸引前の生理食塩水注入はルーチンでは利益より害が大きいとされる。", "s": "✅（Benefits and harms of normal saline instillation before suctioning: SR/MA 2023）", "st": "touched", "rem": 0.09}, {"b": "生理食塩水注入は吸引5分後のSpO2を有意に下げる（5 RCT・337例のメタ解析。プール平均差 −1.14%〔95% CI −2.25〜−0.03〕で、生理食塩水非投与群の方が5分後SpO2が有意に高い）。", "s": "✅（Normal saline instillation before suctioning: meta-analysis (Aust Crit Care 2017)）", "st": "cold", "rem": 0.36}, {"b": "混合静脈血酸素飽和度（SvO2）がベースラインに戻るまでの時間は生理食塩水使用で平均3.78分延長した。", "s": "✅（Instillation of normal saline during suctioning: effects on SvO2, Am J Crit Care 1999）", "st": "touched", "rem": 0.67}, {"b": "生理食塩水は気管チューブ内バイオフィルムの細菌を下気道へ押し込む：カテーテル挿入単独で最大60,000コロニー、5 mLの生理食塩水注入で最大310,000コロニー（約5倍）が剥離した（挿管48時間以上の10例の抜管直後チューブ）。", "s": "⚠️（Endotracheal saline and suction catheters: sources of lower airway contamination 1994）", "st": "cold", "rem": 0.58}]}, {"h": "5. 閉鎖式と開放式：VAPは減らないが、使い分けの場面がある", "rows": [{"b": "Cochraneレビュー（16試験）では、閉鎖式吸引は開放式と比べて人工呼吸器関連肺炎（VAP）発生率・死亡率・ICU滞在日数のいずれも有意差なし。", "s": "✅（Closed vs open tracheal suction systems, Cochrane 2007）", "st": "touched", "rem": 0.28}, {"b": "VAP予防効果は一次資料間で結論が割れる（", "s": "❓両論併記）：Cochrane 2007は開放式と差なし、一方Kuriyama 2015（Intensive Care Med, 16 RCT・1929例）は閉鎖式でVAPが減少（RR 0.69, 95% CI 0.54–0.87）と報告。ただし逐次解析では確固たる証拠は不足とされ、死亡・人工呼吸期間は両者とも差なし。❓（Cochrane 2007／Kuriyama, Intensive Care Med 2015）", "st": "touched", "rem": 0.67}, {"b": "いずれにせよ閉鎖式は吸引中もPEEP・換気を維持できるため、高PEEP・高FiO2患者の酸素化維持・肺容量維持の観点で提案される。", "s": "✅（Impact of closed vs open tracheal suctioning: SR/MA, Intensive Care Med 2015）", "st": "kept", "rem": 0.33}, {"b": "閉鎖式は循環動態が不安定な患者や、吸引でSpO2が大きく落ちる患者に向く。回路交換頻度・コストは施設のプロトコルで判断する。", "s": "⚠️（Impact of closed vs open suctioning: SR/MA 2015）", "st": "settled", "rem": 0.84}]}]}, {"title": "💡 「ムセる」患者の誤嚥リスク評価はどう行うか？", "n": 17, "sections": [{"h": "1. 「ムセの有無」だけで判断しない理由", "rows": [{"b": "不顕性誤嚥は誤嚥事象の 42.9〜69.8% を占め、臨床嚥下評価は不顕性誤嚥の最大 50% を見逃す。", "s": "⚠️ Syst Rev & Meta 2024", "st": "touched", "rem": 0.94}, {"b": "VFSS 1,000例の検討で、誤嚥例（全体の57%）のうち 52%が不顕性（咳反射なし）だった。", "s": "⚠️ Garon 1996", "st": "kept", "rem": 0.38}, {"b": "脳卒中後嚥下障害の頻度は約 46.6%、嚥下障害があると呼吸器感染・肺炎の頻度は非合併群の 2〜4倍。", "s": "⚠️ Front Neurol 2024", "st": "settled", "rem": 0.47}, {"b": "嚥下障害を合併すると肺炎リスクは約 3倍（RR 3.17）、さらにVFSSで誤嚥が確認された例では約 11倍（RR 11.56）に上昇する（「約11倍」は脳卒中患者一般ではなく誤嚥確認例の値）。", "s": "⚠️ Martino 2005 SR・Martino & Black 総説", "st": "settled", "rem": 0.77}]}, {"h": "2. 一次スクリーニング（ベッドサイドの嚥下テスト）", "rows": [{"b": "反復唾液嚥下テスト（RSST）：30秒間の空嚥下回数が 3回未満で陽性。感度 0.98・特異度 0.66 と高感度・非侵襲で、最初のふるい分けに適する。", "s": "✅（感度）／⚠️（特異度は低め） 熊本大 資料・藤田医大 小口", "st": "cold", "rem": 0.89}, {"b": "", "s": "⚠️ 注意（文脈）：感度0.98は原著（機能性嚥下障害131例・多くは脳血管障害）の値。近年の全原因嚥下障害コホートでは同一カットオフで感度25〜36%と大幅に低い報告があり、単独スクリーニングとして過信しない。⚠️ Laryngoscope 2025・Clin Med 2025", "st": "touched", "rem": 0.5}, {"b": "改訂水飲みテスト（MWST）：冷水 3mL を嚥下させ、むせ・湿性嗄声・呼吸変化を5段階評価し 3点以下で問題あり。", "s": "⚠️ 藤田医大 小口", "st": "escaping", "rem": 0.33}, {"b": "3オンス（約90mL）水飲みテスト／Yale Swallow Protocol：連続飲水を中断なく飲め、咳・湿性嗄声がなければ通過。3,000例のFEES基準で感度 96.5%・特異度 48.7%（高感度・低特異度＝偽陽性が多い）。", "s": "✅ Suiter & Leder 2008", "st": "touched", "rem": 0.22}, {"b": "二重盲検VFSS研究（少数・男性中心）では感度 100%・特異度 64%・NPV 100%。", "s": "⚠️（小規模サンプル）Suiter & Leder 2014。回復期FEES多施設研究（n=240）では感度 95.4%・特異度 66.9%・NPV 92.4%。✅ Ward 2020", "st": "touched", "rem": 0.4}, {"b": "", "s": "⚠️ 注意：抜管直後の重症患者では感度 75%・特異度 61% に低下。ICU・気道系では過信しない。⚠️ AJSLP 2025", "st": "touched", "rem": 0.5}, {"b": "GUSS（Gugging Swallowing Screen）：半固形→液体の段階式で誤嚥リスクを層別し、食形態推奨まで出す。14点カットオフで感度 100%／特異度 50%（原著）、再検証で 96.5%／55.8%。", "s": "✅（高感度）／⚠️（特異度は低め） Trapl 2007・GUSS revisited 2017", "st": "cold", "rem": 0.0}, {"b": "🇯🇵 日本のガイドライン（嚥下障害診療ガイドライン2024年版・日本耳鼻咽喉科頭頸部外科学会）：脳卒中患者の水嚥下検査SRで誤嚥検出の感度 64〜79%・特異度 61〜81%、正診率は水の量に左右され 3オンス水嚥下が最も推奨。水嚥下＋パルスオキシメーター併用は感度 73〜98%・特異度 63〜76% と最も優れ、不顕性誤嚥の検出に有用と明記。", "s": "✅ 嚥下障害診療GL2024", "st": "kept", "rem": 0.33}]}, {"h": "3. 危険徴候・身体所見（不顕性誤嚥を検出する）", "rows": [{"b": "嚥下反射の遅延、随意咳の減弱、嚥下時の咳、湿性嗄声（wet voice）・声質変化、軟口蓋機能低下などが誤嚥の予測因子。", "s": "⚠️ EBRSR Ch.15", "st": "cold", "rem": 0.36}, {"b": "パルスオキシメトリでの嚥下時SpO₂低下は補助所見（単独では確定不可）。", "s": "⚠️ Eur Arch ORL 2024", "st": "touched", "rem": 0.59}]}, {"h": "4. 精密検査（VFSS / FEES）とその適応", "rows": [{"b": "嚥下造影（VFSS）と嚥下内視鏡（FEES）がゴールドスタンダード。総合的な診断精度に有意差はないが、FEESは誤嚥・喉頭侵入（penetration）・咽頭残留の検出でやや優れる。可用性・チーム経験・患者要因で選択する。", "s": "✅ Syst Rev 2020（総合精度に有意差なし）／⚠️ Meta 2016（FEESの誤嚥感度0.88 vs VFSS 0.77, p=.03）", "st": "settled", "rem": 0.32}, {"b": "FEESは咽頭残留・喉頭侵入（penetration）・誤嚥の検出でVFSSと同等以上。", "s": "✅ Syst Rev 2020", "st": "cold", "rem": 0.77}]}, {"h": "5. 実践フロー（層別化と対応）", "rows": [{"b": "単一の推奨スクリーニング法は確立していない（AHA/ASA）。自施設で検証済みのプロトコルを用いる。", "s": "⚠️ AHA/ASA Performance Measures", "st": "cold", "rem": 0.91}]}]}, {"title": "💡 人工呼吸器の開始時、最初に確認・設定すべき項目は？", "n": 14, "sections": [{"h": "1. 開始前の大前提：予測体重(PBW)とモード選択", "rows": [{"b": "一回換気量は実体重でなく予測体重(PBW)で決めるため、まず身長・性別からPBWを算出する。男性=50+0.91×(身長cm−152.4)／女性=45.5+0.91×(身長cm−152.4)。※原典のARDSNet式はインチ基準（男性=50＋2.3×[身長inch−60]／女性=45.5＋2.3×[同]）で、本式はその cm 換算版（2.3÷2.54≈0.91）。", "s": "✅ ARDSNet Tools（PBW原典） ／ LITFL Protective Lung Ventilation", "st": "escaping", "rem": 0.66}, {"b": "モードは肺保護の基本である従量式アシストコントロール(VC/AC)が第一選択になりやすい。VTを保証でき、ARDSでの標準。低コンプライアンス肺では従圧式(PC)も選択肢だが換気量が変動する。", "s": "⚠️ Critical Care Time: Ventilator Basics", "st": "cold", "rem": 0.19}, {"b": "従量式は気道内圧を監視、従圧式は1回換気量を監視するのが原則。", "s": "✅ ナース専科ほか", "st": "kept", "rem": 0.25}]}, {"h": "2. 換気設定：一回換気量(VT)・呼吸数(RR)", "rows": [{"b": "VT = 6〜8 mL/kg PBWで開始し、ARDSでは6 mL/kgへ漸減（必要なら最小4 mL/kgまで1 mL/kgずつ）。非ARDSでも肺保護的な低容量が推奨。", "s": "✅ ARDSnet Protocol ／ UCSF Hospital Handbook", "st": "cold", "rem": 0.53}, {"b": "RR = 概ね10〜20/分をベースラインの分時換気量に合わせて設定（≤35/分、pH 7.30–7.45を目標）。閉塞性肺疾患では呼気時間を延長しauto-PEEPを回避。", "s": "⚠️ LITFL ARDSnet Strategy ／ StatPearls", "st": "cold", "rem": 0.78}]}, {"h": "3. 酸素化設定：FiO₂・PEEP", "rows": [{"b": "FiO₂ = 1.0(100%)で開始し、SpO₂ 88–95% / PaO₂ 55–80 mmHgを目標に速やかに漸減（酸素毒性回避のため≤0.7を目安）。", "s": "✅ UCSF Hospital Handbook", "st": "kept", "rem": 0.03}, {"b": "", "s": "⚠️ 日本の運用（施設差）：SpO₂目標はARDSNet由来の88–95%が国際標準だが、国内実務では92–94%前後（目安88–96%）を採る施設が多い。海外基準は参考にとどめ、酸素毒性を避けつつ各施設プロトコルに合わせる。IMI WEBセミナー ／ 和歌山県立医大：酸素療法・人工呼吸器", "st": "touched", "rem": 0.5}, {"b": "PEEP = 最低5 cmH₂Oで開始し、FiO₂/PEEPスライドスケール（例：FiO₂ 0.4→PEEP 5–8、FiO₂ 0.7→PEEP 10–14）で調整。COPD/喘息ではauto-PEEPに注意。", "s": "✅ ARDSnet Protocol Card (GWU)", "st": "kept", "rem": 0.93}]}, {"h": "4. 圧の安全域とモニタリング（VILI予防）", "rows": [{"b": "プラトー圧(Pplat) ≤30 cmH₂Oを目標。超える場合はVTを段階的に低下。", "s": "✅ LITFL ARDSnet Strategy", "st": "cold", "rem": 0.53}, {"b": "ドライビング圧(ΔP = Pplat − PEEP)も独立した予後関連因子（低いほど良い。ΔP 1-SD≈7 cmH₂Oの上昇で死亡リスク上昇：RR 1.41, 95%CI 1.31–1.51）。", "s": "⚠️ 一次資料はAmato et al. NEJM 2015（総説のTen golden rules (ScienceDirect)ではなく原著に帰属）", "st": "cold", "rem": 0.58}, {"b": "I:E比は通常1:2（60÷RRで呼吸周期を求め吸気:呼気=1:2に配分）、閉塞性では呼気延長。トリガー感度を適切化し非同調を防ぐ。", "s": "✅ Deranged Physiology: I:E ratio ／ StatPearls NBK535395", "st": "touched", "rem": 0.92}]}, {"h": "5. 開始直後のチェック：アラーム・回路・モニタリング", "rows": [{"b": "アラーム設定は初期値のまま放置しない。目安：高圧＝安定気道内圧＋10 cmH₂O、低圧＝安定気道内圧の約70%、低分時換気量下限＝実測の70–80%。回路外れ検知の鳴動確認まで実施。", "s": "⚠️ IMI 人工呼吸器アラームの適正設定", "st": "touched", "rem": 0.68}, {"b": "回路接続・加温加湿器の設定確認、および SpO₂・EtCO₂(カプノグラフィ)・動脈血ガスでの換気評価、鎮静レベルの確認。", "s": "✅ StatPearls: Mechanical Ventilation", "st": "kept", "rem": 0.29}, {"b": "ARDS診療ガイドライン2021（日本呼吸療法医学会・日本呼吸器学会・日本集中治療医学会） — 国内の成人ARDS呼吸管理の正本。プラトー圧制限を条件付き推奨（GRADE 2D）など、海外プロトコルの数値を国内適用する際の基準として最優先で参照。", "s": "JSICM版PDF ／ Minds要約", "st": "touched", "rem": 0.99}]}]}, {"title": "💡 人工呼吸中ICU患者で早期離床（48–72h以内）はICU-AWを減らすか？", "n": 13, "sections": [{"h": "1. ICU-AWは高頻度で予後に直結し、不動が修飾可能な主因", "rows": [{"b": "ICU-AWの発症率は対象集団・診断基準により幅が大きく、人工呼吸7日以上でおよそ30〜57%（報告により約40%）、敗血症・多臓器不全では50〜100%と報告される。人工呼吸期間・在室日数の延長、1年死亡率上昇と関連する。", "s": "⚠️ ICU-AW PT reviewICU-AW recent insights", "st": "cold", "rem": 0.38}, {"b": "不動（bed rest）は修飾可能な主要因で、重症患者は急性期に骨格筋量を1日あたり約2%（初週で10%超）失いうる。", "s": "⚠️ 筋量減少SR&MA 2022", "st": "touched", "rem": 0.04}]}, {"h": "2. 開始タイミング：48〜72時間以内が機能・在室・人工呼吸期間に有利", "rows": [{"b": "ネットワークメタ解析（Ding et al. 2019）では、人工呼吸48〜72時間以内の離床開始がICU-AW・臨床アウトカム改善に最適とされた。", "s": "⚠️ Ding 2019 ネットワークメタ解析", "st": "kept", "rem": 0.98}, {"b": "更新系統的レビュー/メタ解析でも、ICU入室72時間以内の開始が機能的アウトカム改善・在室日数短縮・人工呼吸期間短縮と関連。", "s": "⚠️ 更新メタ解析 2025", "st": "cold", "rem": 0.14}, {"b": "【日本】日本集中治療医学会は2017年のエキスパートコンセンサスで早期リハビリテーションを「発症・手術・急性増悪から48時間以内に開始」と定義し、開始基準と中止基準を明示している。さらに2023年の重症患者リハビリテーション診療ガイドライン（J-ReCIP 2023）でGRADEに基づく推奨を整備した。海外のICM 2024（入室72時間以内）は参考に留め、国内ではこのコンセンサスとガイドラインの開始・中止基準を主に据えて運用する。", "s": "✅ J-ReCIP 2023 ／ JSICM 2017 コンセンサス", "st": "kept", "rem": 0.77}]}, {"h": "3. 筋力・ICU-AW発症率そのものへの効果は不確実", "rows": [{"b": "早期段階的離床は筋力・基本動作能力・機能状態を改善し、ICU-AWリスクを下げると報告される（観察研究）。", "s": "⚠️ Zhou 2022", "st": "cold", "rem": 0.08}, {"b": "一方、握力やMV期間で有意差を示さないメタ解析もあり、効果サイズは研究間でばらつく。", "s": "⚠️ 2019メタ解析", "st": "touched", "rem": 0.32}]}, {"h": "4. 安全性：チェックリスト下で実施可能だが有害事象は皆無ではない", "rows": [{"b": "標準化された安全チェックリスト下での早期離床は実施可能で、重篤な有害事象は比較的まれ。", "s": "✅ 更新メタ解析 2025", "st": "kept", "rem": 0.84}, {"b": "ただし不整脈・血圧変動・酸素飽和度低下のリスクは皆無ではなく（TEAMでは転倒・計画外抜管・ライン抜去は報告なし）、開始基準・中止基準の明文化が必須。", "s": "⚠️ TEAM, NEJM 2022", "st": "touched", "rem": 0.49}]}, {"h": "5. 早期・高強度の一律適用は避ける：TEAMは死亡改善なし・有害事象増加", "rows": [{"b": "750例の国際多施設RCT（TEAM）。鎮静最小化＋積極的早期離床は通常ケアと比べ180日死亡を改善せず（22.5% vs 19.5%, OR 1.15, 95%CI 0.81–1.65）。", "s": "⚠️ TEAM, NEJM 2022", "st": "cold", "rem": 0.64}, {"b": "有害事象（不整脈・血圧変動・酸素飽和度低下）はむしろ増加（9.2% vs 4.1%, P=0.005）、重篤有害事象も7件 vs 1件。", "s": "⚠️ TEAM, NEJM 2022", "st": "touched", "rem": 0.22}]}, {"h": "6. PT実務：安全基準を満たす例で段階的に漸増する", "rows": [{"b": "安全基準を満たす患者で、受動運動→端座位→立位→歩行と段階的に進める。", "s": "✅ ICU-AW PT review", "st": "touched", "rem": 0.55}, {"b": "Hodgson CL, et al. Early Active Mobilization during Mechanical Ventilation in the ICU (TEAM). N Engl J Med. 2022;387(19):1747-1758（PMID 36286256） — 180日死亡改善なし（OR 1.15）、有害事象増（9.2% vs 4.1%, P=0.005）。", "s": "NEJM", "st": "cold", "rem": 0.32}]}]}];

  el.innerHTML=head+`<div class="pg">${title}${variant!==2?`<div class="legend"><span><i style="opacity:.35"></i>未着手</span><span><i style="opacity:.55"></i>読んだ</span><span><i class="kept"></i>残した</span><span><i class="settled"></i>深く残した</span><span><i class="escaping"></i>離れかけ</span></div>`:''}${inner}</div><div class="cq">N</div>`+card;
  const veil=el.querySelector('.veil');
  const openCard=(b,s)=>{veil.querySelector('.cb-body').textContent=b;veil.querySelector('.src').textContent=s;veil.classList.add('on')};
  veil.addEventListener('click',e=>{if(e.target===veil||e.target.classList.contains('x'))veil.classList.remove('on')});
  el.querySelectorAll('.toc a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();el.querySelector(`#${id}-a${a.dataset.i}`).scrollIntoView({behavior:'smooth',block:'start'});el.querySelectorAll('.toc a').forEach(x=>x.classList.remove('on'));a.classList.add('on')}));
  if(variant===2){
    el.querySelectorAll('.ahead').forEach(h=>h.addEventListener('click',()=>{const open=h.classList.contains('open');el.querySelectorAll('.ahead').forEach(x=>{x.classList.remove('open');x.nextElementSibling.classList.remove('open')});if(!open){h.classList.add('open');h.nextElementSibling.classList.add('open');}}));
    el.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>openCard(decodeURIComponent(r.dataset.b),decodeURIComponent(r.dataset.s))));
    el.querySelector('.ahead').click();
  } else {
    el.querySelectorAll('.dots i').forEach(i=>i.addEventListener('click',()=>{
      const r=DATA[i.dataset.p].sections[i.dataset.s].rows[i.dataset.r];
      if(variant===1){openCard(r.b,r.s);return}
      const slot=i.closest('.sec').querySelector('.pvslot');
      if(i.classList.contains('sel')){openCard(r.b,r.s);return}
      el.querySelectorAll('.dots i.sel').forEach(x=>x.classList.remove('sel'));el.querySelectorAll('.pvslot').forEach(x=>x.innerHTML='');
      i.classList.add('sel');
      slot.innerHTML=`<div class="pv"><div><p>${r.b}</p><div class="st ${r.st==='escaping'?'g':''}">${ST[r.st]}${r.st==='escaping'?'　もう一度押すと確かめる':''}</div></div><span>開く ›</span></div>`;
      slot.querySelector('.pv').addEventListener('click',()=>openCard(r.b,r.s));
    }));
    if(variant===3){const first=el.querySelector('.dots i.escaping');if(first)first.click();}
  }
  const pg=el.querySelector('.pg');
  document.getElementById('m'+variant).textContent=`ページの長さ ${pg.scrollHeight}px（今の実装は 13,523px）`;
}
build('p1',1);build('p2',2);build('p3',3);
document.getElementById('th').addEventListener('click',()=>{const r=document.documentElement;const dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',dark?'light':'dark')});
