      <rect width="136" height="26" rx="9" fill="#ffffff" stroke="#cfe3d6"/>
      <text x="12" y="17" font-size="10" font-weight="700" fill="#196b4f">第3巻</text>
      <rect x="52" y="8" width="26" height="10" rx="5" fill="#3ecf8e" opacity="0.8"/>
      <rect x="80" y="8" width="18" height="10" rx="5" fill="#ffc24b" opacity="0.8"/>
      <rect x="100" y="8" width="14" height="10" rx="5" fill="#b394f5" opacity="0.8"/>
      <g transform="translate(120,4)"><use href="#softleaf"/></g>
    </g>
    <g transform="translate(108,370)" filter="url(#drop)">
      <rect width="144" height="26" rx="9" fill="#ffffff" stroke="#cfe3d6"/>
      <text x="12" y="17" font-size="10" font-weight="700" fill="#196b4f">第2巻</text>
      <rect x="52" y="8" width="52" height="10" rx="5" fill="#3ecf8e" opacity="0.8"/>
      <rect x="106" y="8" width="16" height="10" rx="5" fill="#4cc3ff" opacity="0.8"/>
    </g>
    <!-- 丘の地面 -->
    <path d="M20,420 Q190,398 360,420 L360,436 Q190,414 20,436 Z" fill="#cde7d6"/>
    <ellipse cx="188" cy="412" rx="120" ry="10" fill="#0d3a2b" opacity="0.06"/>
    <!-- ログ -->
    <g transform="translate(36,462)"><use href="#softleaf"/></g>
    <text x="52" y="470" font-size="10" fill="#374151">きのう <tspan font-weight="700" fill="#196b4f">敗血症の初期輸液</tspan> に葉がつきました</text>
    <text x="34" y="492" font-size="10" fill="#6b7280">くすんだブロック 3個 → <tspan fill="#196b4f">今日の回診へ</tspan></text>
