    <!-- ログ -->
    <rect x="26" y="400" width="328" height="2" fill="#1c2a49"/>
    <text x="34" y="428" font-size="10" fill="#c9d6ee"><tspan fill="#3ecf8e" font-weight="700">▶ </tspan>きのう <tspan fill="#7bffc4" font-weight="700">敗血症の初期輸液</tspan> に葉が挟まった</text>
    <text x="34" y="450" font-size="10" fill="#8ea3c8"><tspan fill="#ffc24b" font-weight="700">▶ </tspan>くすんだブロック 3個 → <tspan fill="#3ecf8e">今日の回診へ</tspan></text>
    <text x="34" y="486" font-size="9" fill="#5b6f9a">ゲームの結界・スコア感・実装最軽量</text>
  </g>

  <!-- ============== B: ソフト物理・つみネコ系 ============== -->
  <g transform="translate(430,64)">
    <text x="190" y="16" font-size="13" font-weight="700" fill="#196b4f" text-anchor="middle">B ─ ソフト物理・つみネコ系</text>
    <rect x="0" y="28" width="380" height="540" rx="20" fill="url(#skyB)" stroke="#d8e8dd" filter="url(#cardSh)"/>
    <!-- 雲 -->
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="80" cy="100" rx="30" ry="12"/><ellipse cx="104" cy="94" rx="20" ry="10"/>
      <ellipse cx="60" cy="248" rx="26" ry="9"/><ellipse cx="78" cy="242" rx="16" ry="7"/>
    </g>
    <!-- ヘッダ -->
    <text x="34" y="78" font-size="12" font-weight="700" fill="#196b4f">知の塔</text>
    <text x="34" y="112" font-size="30" font-weight="700" fill="#1f2937">18.4<tspan font-size="14" fill="#6b7280"> cm</tspan></text>
    <text x="34" y="132" font-size="10" fill="#6b7280">学び 214歩 ・ 今週 +9</text>
    <!-- ネコ（まるい後ろ姿） -->
    <g transform="translate(296,158)">
      <text x="0" y="-38" font-size="9.5" fill="#8aa095" text-anchor="middle">ネコ 30cm</text>
      <path fill="#b9cbbf" d="M-22,36 C-22,10 -10,-4 0,-4 C10,-4 22,10 22,36 Z"/>
      <circle cx="0" cy="-8" r="13" fill="#b9cbbf"/>
      <path fill="#b9cbbf" d="M-10,-16 L-15,-30 L-3,-19 Z"/>
      <path fill="#b9cbbf" d="M10,-16 L15,-30 L3,-19 Z"/>
      <path fill="none" stroke="#b9cbbf" stroke-width="6" stroke-linecap="round" d="M20,32 C34,28 36,14 26,10"/>
    </g>
    <line x1="30" y1="196" x2="336" y2="196" stroke="#c4d8cb" stroke-width="1.4" stroke-dasharray="2 6" stroke-linecap="round"/>
    <g transform="translate(268,206)">
      <rect width="60" height="20" rx="10" fill="#ffffff" stroke="#bfe0cd" filter="url(#cardSh)"/>
      <text x="30" y="14" font-size="10" font-weight="700" fill="#196b4f" text-anchor="middle">あと12歩</text>
    </g>
    <!-- 落下ブロック（傾いて・弧線つき） -->
    <text x="118" y="140" font-size="9.5" fill="#8aa095">アナフィラキシー初期対応</text>
    <g transform="translate(118,160) rotate(-7)" filter="url(#drop)">
      <rect width="116" height="24" rx="10" fill="#ffc24b"/>
      <rect x="4" y="3" width="108" height="8" rx="4" fill="#ffe097" opacity="0.9"/>
    </g>
    <path d="M104,170 Q98,178 104,186" stroke="#c4d8cb" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g transform="translate(240,158)">
      <rect width="32" height="20" rx="10" fill="#196b4f"/>
      <text x="16" y="14" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">+1</text>
    </g>
    <!-- 塔（やわらかいブロックがぐらっと積まれている） -->
    <g>
      <g transform="translate(136,232) rotate(3.2)" filter="url(#drop)"><rect width="112" height="22" rx="10" fill="#e9f0f6" stroke="#c9d6df"/><rect x="4" y="3" width="104" height="7" rx="3.5" fill="#ffffff" opacity="0.85"/></g>
      <g transform="translate(120,252) rotate(-2.6)" filter="url(#drop)"><rect width="116" height="24" rx="10" fill="#3ecf8e"/><rect x="4" y="3" width="108" height="8" rx="4" fill="#7bffc4" opacity="0.85"/><g transform="translate(112,-4)"><use href="#softleaf"/></g></g>
      <g transform="translate(132,274) rotate(1.8)" filter="url(#drop)"><rect width="110" height="22" rx="10" fill="#cfc49a"/><rect x="4" y="3" width="102" height="7" rx="3.5" fill="#e0d7b4" opacity="0.9"/></g>
      <g transform="translate(116,295) rotate(-1.2)" filter="url(#drop)"><rect width="118" height="24" rx="10" fill="#b394f5"/><rect x="4" y="3" width="110" height="8" rx="4" fill="#d7c5ff" opacity="0.85"/></g>
      <g transform="translate(128,318) rotate(2.4)" filter="url(#drop)"><rect width="112" height="23" rx="10" fill="#4cc3ff"/><rect x="4" y="3" width="104" height="7" rx="3.5" fill="#a5e2ff" opacity="0.85"/><g transform="translate(108,-4)"><use href="#softleaf"/></g></g>
    </g>
    <!-- 巻（やわらかい台） -->
