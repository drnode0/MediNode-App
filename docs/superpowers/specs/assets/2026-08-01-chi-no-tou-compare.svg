      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#9fb4e0" letter-spacing="0.12em">VOL.1</text>
      <rect x="0" y="18" width="98" height="4" fill="#3ecf8e" opacity="0.75"/><rect x="98" y="18" width="26" height="4" fill="#b394f5" opacity="0.75"/>
    </g>
    <rect x="40" y="358" width="280" height="3" fill="#2c3d61"/>
    <rect x="40" y="361" width="280" height="8" fill="#141f3a"/>
