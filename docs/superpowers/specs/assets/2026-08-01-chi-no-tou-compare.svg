    <rect x="0" y="28" width="380" height="540" rx="20" fill="url(#dawnC)" stroke="#dcded6" filter="url(#cardSh)"/>
    <!-- 霞 -->
    <ellipse cx="140" cy="208" rx="120" ry="8" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="260" cy="230" rx="120" ry="7" fill="#ffffff" opacity="0.30"/>
    <!-- ヘッダ -->
    <text x="34" y="80" font-size="12" fill="#5a6b60" letter-spacing="0.3em">知の塔</text>
    <text x="34" y="116" font-size="30" fill="#3a443e" font-weight="300">18.4<tspan font-size="14" fill="#8a958d"> cm</tspan></text>
    <text x="34" y="136" font-size="10" fill="#8a958d">学び 214歩</text>
    <!-- 目盛り（線と文字だけ・生き物は描かない） -->
    <line x1="30" y1="192" x2="350" y2="192" stroke="#c8cec4" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>
    <text x="350" y="182" font-size="9.5" fill="#8a958d" text-anchor="end">ネコ 30cm ・ あと12歩</text>
    <!-- 置かれようとしている石 -->
    <g transform="translate(158,148)" filter="url(#drop)">
      <ellipse cx="34" cy="12" rx="34" ry="12" fill="#a9b1a6"/>
      <ellipse cx="26" cy="9" rx="16" ry="5" fill="#bcc3b8" opacity="0.8"/>
    </g>
    <text x="238" y="156" font-size="9.5" fill="#8a958d">＋一歩</text>
    <!-- 石積み -->
    <g>
      <g transform="translate(146,236)" filter="url(#drop)"><ellipse cx="42" cy="14" rx="42" ry="14" fill="#9aa398"/><ellipse cx="32" cy="10" rx="20" ry="6" fill="#adb5aa" opacity="0.85"/><g transform="translate(76,2)"><use href="#softleaf"/></g></g>
      <g transform="translate(132,262)" filter="url(#drop)"><ellipse cx="52" cy="16" rx="52" ry="16" fill="#8b948a"/><ellipse cx="40" cy="11" rx="26" ry="7" fill="#9fa89d" opacity="0.85"/></g>
      <g transform="translate(140,292)" filter="url(#drop)"><ellipse cx="46" cy="15" rx="46" ry="15" fill="#a3aca0"/><ellipse cx="36" cy="10" rx="22" ry="6" fill="#b5bdb1" opacity="0.85"/><g transform="translate(84,3)"><use href="#softleaf"/></g></g>
      <g transform="translate(124,322)" filter="url(#drop)"><ellipse cx="58" cy="17" rx="58" ry="17" fill="#7e877d"/><ellipse cx="46" cy="12" rx="30" ry="8" fill="#929b90" opacity="0.85"/></g>
      <g transform="translate(134,354)" filter="url(#drop)"><ellipse cx="50" cy="16" rx="50" ry="16" fill="#959e93"/><ellipse cx="40" cy="11" rx="24" ry="7" fill="#a8b1a5" opacity="0.85"/></g>
      <!-- 巻＝広い台石 -->
