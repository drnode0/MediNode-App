      <rect x="0" y="18" width="80" height="4" fill="#3ecf8e" opacity="0.75"/><rect x="80" y="18" width="24" height="4" fill="#4cc3ff" opacity="0.75"/><rect x="104" y="18" width="28" height="4" fill="#ffc24b" opacity="0.75"/>
    </g>
    <g transform="translate(114,334)">
