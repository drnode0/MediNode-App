      <rect x="0" y="18" width="46" height="4" fill="#3ecf8e" opacity="0.75"/><rect x="46" y="18" width="30" height="4" fill="#ffc24b" opacity="0.75"/><rect x="76" y="18" width="28" height="4" fill="#b394f5" opacity="0.75"/><rect x="104" y="18" width="24" height="4" fill="#4cc3ff" opacity="0.75"/>
    </g>
    <g transform="translate(110,312)">
      <rect width="132" height="22" fill="#223154"/><rect width="132" height="4" fill="#31456f"/>
