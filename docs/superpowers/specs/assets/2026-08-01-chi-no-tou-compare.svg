<svg viewBox="0 0 1240 640" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#111c36"/>
    </linearGradient>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff2ff"/>
      <stop offset="0.7" stop-color="#eefaf3"/>
      <stop offset="1" stop-color="#f7fdf9"/>
    </linearGradient>
    <linearGradient id="dawnC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f1ec"/>
      <stop offset="1" stop-color="#e7e9e2"/>
    </linearGradient>
    <pattern id="scanA" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="4" height="1" fill="#000000" opacity="0.16"/>
    </pattern>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#233" flood-opacity="0.18"/>
    </filter>
    <filter id="cardSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0d3a2b" flood-opacity="0.12"/>
    </filter>
    <!-- ドット葉 -->
    <g id="pleafS">
      <rect x="4" y="0" width="4" height="2" fill="#7bffc4"/>
      <rect x="2" y="2" width="6" height="2" fill="#3ecf8e"/>
      <rect x="0" y="4" width="6" height="2" fill="#3ecf8e"/>
      <rect x="0" y="6" width="3" height="2" fill="#1d9c66"/>
    </g>
    <!-- ソフト葉 -->
    <g id="softleaf">
      <path d="M0,0 Q4,-6 11,-4 Q10,2 3,3 Q1,2 0,0 Z" fill="#4aae8c"/>
    </g>
    <!-- 18.4 ドット数字 cell=5 -->
    <g id="scoreS">
      <rect x="5" y="0" width="5" height="5"/><rect x="0" y="5" width="5" height="5"/><rect x="5" y="5" width="5" height="5"/>
      <rect x="5" y="10" width="5" height="5"/><rect x="5" y="15" width="5" height="5"/>
      <rect x="0" y="20" width="5" height="5"/><rect x="5" y="20" width="5" height="5"/><rect x="10" y="20" width="5" height="5"/>
      <g transform="translate(21,0)">
        <rect x="0" y="0" width="5" height="5"/><rect x="5" y="0" width="5" height="5"/><rect x="10" y="0" width="5" height="5"/>
        <rect x="0" y="5" width="5" height="5"/><rect x="10" y="5" width="5" height="5"/>
        <rect x="0" y="10" width="5" height="5"/><rect x="5" y="10" width="5" height="5"/><rect x="10" y="10" width="5" height="5"/>
        <rect x="0" y="15" width="5" height="5"/><rect x="10" y="15" width="5" height="5"/>
        <rect x="0" y="20" width="5" height="5"/><rect x="5" y="20" width="5" height="5"/><rect x="10" y="20" width="5" height="5"/>
      </g>
      <rect x="41" y="20" width="5" height="5"/>
      <g transform="translate(51,0)">
        <rect x="0" y="0" width="5" height="5"/><rect x="10" y="0" width="5" height="5"/>
        <rect x="0" y="5" width="5" height="5"/><rect x="10" y="5" width="5" height="5"/>
        <rect x="0" y="10" width="5" height="5"/><rect x="5" y="10" width="5" height="5"/><rect x="10" y="10" width="5" height="5"/>
        <rect x="10" y="15" width="5" height="5"/><rect x="10" y="20" width="5" height="5"/>
      </g>
    </g>
  </defs>

  <rect width="1240" height="640" fill="url(#pageBg)"/>
  <text x="40" y="42" font-size="15" font-weight="700" fill="#374151">同じデータ（18.4cm・学び214歩・ネコまで12歩）を3つのスキンで</text>

  <!-- ============== A: 夜ドット・アーケード ============== -->
  <g transform="translate(20,64)">
    <text x="190" y="16" font-size="13" font-weight="700" fill="#196b4f" text-anchor="middle">A ─ 夜ドット・アーケード</text>
    <rect x="0" y="28" width="380" height="540" rx="20" fill="#0b1322" stroke="#1c2a49" stroke-width="1.5" filter="url(#cardSh)"/>
    <rect x="10" y="38" width="360" height="520" rx="14" fill="url(#screenA)"/>
    <!-- 星 -->
    <g fill="#31405f">
      <rect x="60" y="120" width="3" height="3"/><rect x="300" y="90" width="2" height="2"/><rect x="140" y="76" width="2" height="2"/>
      <rect x="330" y="200" width="2" height="2"/><rect x="50" y="230" width="2" height="2"/>
    </g>
    <!-- ヘッダ -->
    <text x="34" y="78" font-size="11" font-weight="700" fill="#3ecf8e" letter-spacing="0.2em">知の塔</text>
    <use href="#scoreS" transform="translate(35,89)" fill="#173a2c"/>
    <use href="#scoreS" transform="translate(33,87)" fill="#eaf2ff"/>
    <text x="104" y="112" font-size="10" fill="#8ea3c8">cm</text>
    <text x="34" y="130" font-size="9.5" fill="#8ea3c8">学び 214歩 ・ 今週 +9</text>
    <!-- ネコと線 -->
    <g transform="translate(268,150)">
      <text x="26" y="-6" font-size="9" fill="#8ea3c8" text-anchor="middle">ネコ 30cm</text>
      <g fill="#94a8cf">
        <rect x="4" y="0" width="4" height="4"/><rect x="4" y="4" width="8" height="4"/>
        <rect x="36" y="0" width="4" height="4"/><rect x="32" y="4" width="8" height="4"/>
        <rect x="8" y="8" width="32" height="12"/>
        <rect x="12" y="20" width="24" height="4"/>
        <rect x="8" y="24" width="32" height="16"/>
        <rect x="8" y="40" width="12" height="4"/><rect x="28" y="40" width="12" height="4"/>
        <rect x="40" y="36" width="4" height="8"/><rect x="44" y="28" width="4" height="10"/>
      </g>
      <g fill="#0e1830"><rect x="16" y="12" width="4" height="4"/><rect x="28" y="12" width="4" height="4"/></g>
    </g>
    <g fill="#2c3d61">
      <rect x="30" y="194" width="5" height="2"/><rect x="42" y="194" width="5" height="2"/><rect x="54" y="194" width="5" height="2"/>
      <rect x="66" y="194" width="5" height="2"/><rect x="78" y="194" width="5" height="2"/><rect x="90" y="194" width="5" height="2"/>
      <rect x="102" y="194" width="5" height="2"/><rect x="114" y="194" width="5" height="2"/><rect x="126" y="194" width="5" height="2"/>
      <rect x="138" y="194" width="5" height="2"/><rect x="150" y="194" width="5" height="2"/><rect x="162" y="194" width="5" height="2"/>
      <rect x="174" y="194" width="5" height="2"/><rect x="186" y="194" width="5" height="2"/><rect x="198" y="194" width="5" height="2"/>
      <rect x="210" y="194" width="5" height="2"/><rect x="222" y="194" width="5" height="2"/><rect x="234" y="194" width="5" height="2"/>
      <rect x="246" y="194" width="5" height="2"/><rect x="258" y="194" width="5" height="2"/><rect x="270" y="194" width="5" height="2"/>
      <rect x="282" y="194" width="5" height="2"/><rect x="294" y="194" width="5" height="2"/><rect x="306" y="194" width="5" height="2"/>
      <rect x="318" y="194" width="5" height="2"/><rect x="330" y="194" width="5" height="2"/>
    </g>
    <g transform="translate(272,204)">
      <rect width="54" height="17" rx="3" fill="#14301f" stroke="#3ecf8e" stroke-width="1"/>
      <text x="27" y="12" font-size="9" font-weight="700" fill="#3ecf8e" text-anchor="middle">あと12歩</text>
    </g>
    <!-- 落下ブロック -->
    <rect x="120" y="140" width="104" height="12" fill="#ffc24b"/>
    <rect x="120" y="140" width="104" height="3" fill="#ffe097"/>
    <rect x="120" y="149" width="104" height="3" fill="#c78e1e"/>
    <g transform="translate(230,134)">
      <rect width="28" height="16" rx="3" fill="#3ecf8e"/>
      <text x="14" y="12" font-size="9.5" font-weight="700" fill="#0b1322" text-anchor="middle">+1</text>
    </g>
    <!-- 塔 -->
    <g>
      <g transform="translate(128,218)"><rect width="104" height="12" fill="#16223a" stroke="#56688f" stroke-width="2"/></g>
      <g transform="translate(118,230)"><rect width="104" height="12" fill="#ffc24b"/><rect width="104" height="3" fill="#ffe097"/><rect y="9" width="104" height="3" fill="#c78e1e"/></g>
      <g transform="translate(125,242)"><rect width="104" height="12" fill="#3ecf8e"/><rect width="104" height="3" fill="#7bffc4"/><rect y="9" width="104" height="3" fill="#1d9c66"/><use href="#pleafS" transform="translate(106,2)"/></g>
      <g transform="translate(122,254)"><rect width="104" height="12" fill="#8a8265"/><rect width="104" height="3" fill="#a89f7e"/><rect y="9" width="104" height="3" fill="#6b6448"/></g>
      <g transform="translate(116,266)"><rect width="104" height="12" fill="#b394f5"/><rect width="104" height="3" fill="#d7c5ff"/><rect y="9" width="104" height="3" fill="#8a63d6"/></g>
      <g transform="translate(126,278)"><rect width="104" height="12" fill="#4cc3ff"/><rect width="104" height="3" fill="#a5e2ff"/><rect y="9" width="104" height="3" fill="#2795cf"/><use href="#pleafS" transform="translate(106,2)"/></g>
    </g>
    <!-- VOL -->
    <g transform="translate(112,290)">
      <rect width="128" height="22" fill="#223154"/><rect width="128" height="4" fill="#31456f"/>
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#9fb4e0" letter-spacing="0.12em">VOL.3</text>
