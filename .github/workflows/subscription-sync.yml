# サブスク（プレミアム）Notion → Algolia 同期の日中スケジューラ。
#
# Vercel Cron（毎朝6:00 JST・vercel.json）に加えて、日中にもNotionの追加・編集を
# 反映させる。同期本体はアプリ側の /api/subscription/sync（充実度フィールドの
# 計算込み）で、ここはそれを叩くだけ。
#
# 必要なリポジトリシークレット（公開リポジトリのためファイルに直書き禁止）:
#   SUBSCRIPTION_SYNC_SECRET ... Vercelの環境変数と同じ値
#   （Settings → Secrets and variables → Actions → New repository secret）
name: Subscription Sync (MediNode)

on:
  schedule:
    # JST 9:00 / 12:00 / 15:00 / 18:00 / 21:00（UTC+9）。朝6:00はVercel Cronが担当。
    - cron: '0 0,3,6,9,12 * * *'
  workflow_dispatch: # 手動実行（Actionsタブの Run workflow ボタン）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger subscription sync API
        run: |
          # 同期処理がVercelのmaxDuration(60秒)に近づくと稀にタイムアウトで失敗する
          # （穴埋め抽出でページごとのNotion API呼び出しが増えたため）。次回実行では
          # 大抵成功しているため、まず同一ジョブ内で最大3回リトライしてから失敗扱いにする。
          for i in 1 2 3; do
            # GitHub Actionsのrunステップは既定でset -eが有効なため、curl自体が
            # 失敗（タイムアウト時の接続断など）すると || true がないとここで
            # スクリプトごと即終了し、以降のリトライに進めない。
            response=$(curl -sS -X POST -m 300 \
              -H "x-sync-secret: ${{ secrets.SUBSCRIPTION_SYNC_SECRET }}" \
              https://medical-search-public.vercel.app/api/subscription/sync) || true
            echo "$response"
            if echo "$response" | grep -q '"success":true'; then
              exit 0
            fi
            echo "retry $i failed, waiting before next attempt..."
            sleep 20
          done
          echo "all retries failed"
          exit 1
